<style>
:root{
  --paper:#efecdf;--panel:#faf8ee;--ink:#26241c;--muted:#7c7867;--line:#c8c3ad;--faint:#e2ddc8;
  --blue:#41597e;--red:#a3463c;--yellow:#a8842e;--green:#4a6c46;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  color:var(--ink);background:var(--paper);
}
*{box-sizing:border-box}body{margin:0;min-width:300px;-webkit-font-smoothing:antialiased;background:var(--paper);background-image:repeating-conic-gradient(#26241c07 0% 25%,transparent 0% 50%);background-size:6px 6px}
button,input{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;border:0;line-height:1.3}button:disabled{cursor:default;opacity:.5}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}button:focus:not(:focus-visible){outline:none}
a{color:inherit}svg{display:block}h1,h2,h3,p{margin:0}::selection{background:var(--ink);color:var(--paper)}
[hidden]{display:none!important}.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.mono{letter-spacing:.08em}.eyebrow{font-size:10px;letter-spacing:.14em;font-weight:700}.muted{color:var(--muted)}
.icon{width:100%;height:100%;flex:none}
.shell{max-width:1184px;padding:0 28px;margin:0 auto}
.skip-link{position:fixed;top:-100px;left:18px;background:var(--ink);color:var(--paper);padding:12px;z-index:20}.skip-link:focus{top:12px}
.site-header{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:3px solid var(--ink);padding:10px 0}
.brand{display:flex;align-items:center;gap:14px;background:none;padding:0;text-align:left}
.brand svg{image-rendering:pixelated}
.brand-caption{border-left:3px solid var(--line);padding-left:13px;font-size:9px;line-height:1.6;letter-spacing:.14em;color:var(--muted)}
.desktop-nav{display:flex;gap:0;border:3px solid var(--ink);background:var(--panel)}
.nav-btn{background:none;padding:11px 22px;font-size:13px;font-weight:700;letter-spacing:.06em;border-right:3px solid var(--ink)}
.nav-btn:last-child{border-right:0}
.nav-btn[aria-current="page"]{background:var(--ink);color:var(--paper)}
.header-end{display:flex;align-items:center;gap:10px}
.demo-badge{font-size:9px;letter-spacing:.12em;border:3px solid var(--ink);padding:6px 9px;background:var(--panel);font-weight:700}
.icon-btn{min-width:42px;height:42px;border:3px solid var(--ink);background:var(--panel);font-size:10px;font-weight:700;letter-spacing:.1em;padding:0 10px}
.icon-btn:hover{background:var(--ink);color:var(--paper)}
.corner-badge{position:fixed;z-index:30;border:3px solid var(--ink);background:var(--paper);color:var(--ink);font-size:9px;font-weight:700;letter-spacing:.14em;padding:6px 8px;font-family:inherit}
.corner-badge.dev{position:static;cursor:pointer}
.map-refresh{position:absolute;top:8px;right:8px;z-index:5;border:3px solid var(--ink);background:var(--paper);color:var(--ink);font-weight:700;font-size:9px;letter-spacing:.1em;padding:5px 8px;cursor:pointer}
.map-refresh:hover{background:var(--ink);color:var(--paper)}
.header-end{display:flex;align-items:center;gap:8px}
.account-chip{display:flex;align-items:center;gap:7px;border:3px solid var(--ink);background:var(--panel);padding:3px 10px 3px 4px;font-weight:700;font-size:12px;letter-spacing:.02em}
.account-chip:hover{background:var(--ink);color:var(--paper)}
.account-chip img,.account-chip .avatar-fallback{width:26px;height:26px;border:3px solid var(--ink);object-fit:cover;display:block;background:var(--faint)}
.account-chip:hover img,.account-chip:hover .avatar-fallback{border-color:var(--paper)}
.btn-login-chip{border:3px solid var(--ink);background:var(--panel);font-weight:700;font-size:12px;padding:8px 14px;letter-spacing:.08em}
.btn-login-chip:hover{background:var(--ink);color:var(--paper)}
.auth-divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:10px;margin:14px 0}
.auth-divider:before,.auth-divider:after{content:"";flex:1;border-top:3px solid var(--faint)}
.corner-badge.offline{left:12px;bottom:12px;cursor:default}
.page-intro{display:flex;align-items:end;justify-content:space-between;gap:24px;margin:30px 0 22px}
.page-intro h1{font-size:27px;line-height:1.4;letter-spacing:-.01em;font-weight:700}
.intro-copy{font-size:13px;line-height:1.8;color:var(--muted);margin-top:8px}
.intro-mark{font-size:9px;letter-spacing:.14em;white-space:nowrap;border:3px solid var(--ink);padding:8px 10px;background:var(--panel);font-weight:700;margin-bottom:8px}
.main-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--panel);border:3px solid var(--ink)}
.pet-card{background:var(--panel);border:3px solid var(--ink);padding:12px;position:relative}
.pet-topline{display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:.14em;padding:0 2px 10px;color:var(--muted)}
.pet-online{display:flex;gap:6px;align-items:center}
.live-dot{width:7px;height:7px;display:inline-block;background:var(--green)}
.pet-canvas{position:relative;border:3px solid var(--ink);height:365px;overflow:hidden;background-color:#ece8d6;background-image:linear-gradient(#26241c0d 1px,transparent 1px),linear-gradient(90deg,#26241c0d 1px,transparent 1px);background-size:22px 22px}
.pet-canvas.music{background-color:#e2e5ea}.pet-canvas.art{background-color:#ece2da}.pet-canvas.market{background-color:#eae4cc}
.pet-canvas.evolved{background-color:#2e2c25;background-image:linear-gradient(#ffffff14 1px,transparent 1px),linear-gradient(90deg,#ffffff14 1px,transparent 1px);color:var(--paper)}
.canvas-id{position:absolute;top:13px;left:14px;font-size:9px;letter-spacing:.14em;font-weight:700;z-index:1;background:var(--paper);border:3px solid var(--ink);padding:4px 7px;color:var(--ink)}
.pet-canvas.evolved .canvas-id{background:var(--paper)}
.deco{position:absolute;font-size:14px;font-weight:700;z-index:1;opacity:.5}
.deco.d1{left:22px;top:110px}.deco.d2{right:26px;top:170px}
.pet-touch{width:290px;height:280px;position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:none;padding:0;z-index:2}
.pet-touch svg{width:100%;height:100%;image-rendering:pixelated;animation:bob 1.4s steps(1,end) infinite}
.pet-touch.hop svg{animation:hop .5s steps(1,end) 1}
@keyframes bob{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-4px)}}
@keyframes hop{0%,24%{transform:translateY(0)}25%,49%{transform:translateY(-14px)}50%,74%{transform:translateY(0)}75%,100%{transform:translateY(-7px)}}
.ground{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);width:190px;height:10px;border-bottom:3px solid var(--ink);background:repeating-conic-gradient(#26241c30 0% 25%,transparent 0% 50%) 0 0/6px 6px}
.evolved .ground{border-bottom-color:#efecdf;background:repeating-conic-gradient(#efecdf40 0% 25%,transparent 0% 50%) 0 0/6px 6px}
.orbit-note{position:absolute;left:16px;bottom:16px;font-size:8px;letter-spacing:.16em;z-index:3;color:var(--muted)}
.evolved .orbit-note{color:#b9b4a0}
.screen-badge{position:absolute;right:16px;bottom:16px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);padding:7px 9px;font-size:9px;letter-spacing:.14em;font-weight:700;z-index:3}
.screen-badge.hungry{background:var(--accent,#a3463c);color:#fcfaf0;animation:badge-blink 1.2s steps(2,end) infinite}
@keyframes badge-blink{50%{opacity:.55}}
/* 饿的分级动画：饱=弹跳 / 平常=呼吸 / 饿=垂头摇 / 濒饿=发抖 */
.pet-canvas.mood-full .pet-svg{animation:pet-bounce 1.4s steps(5,end) infinite}
.pet-canvas.mood-ok .pet-svg{animation:pet-idle 2.6s steps(6,end) infinite}
.pet-canvas.mood-hungry .pet-svg{animation:pet-slouch 2.8s steps(7,end) infinite;transform-origin:50% 100%}
.pet-canvas.mood-starving .pet-svg{animation:pet-tremble .45s steps(3,end) infinite}
@keyframes pet-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes pet-bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}70%{transform:translateY(-2px)}}
@keyframes pet-slouch{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg) translateY(1px)}}
@keyframes pet-tremble{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@media (prefers-reduced-motion:reduce){.pet-canvas .pet-svg{animation:none!important}}
.pet-caption{display:flex;align-items:center;justify-content:space-between;padding:15px 2px 4px;gap:12px}
.pet-name{font-size:21px;font-weight:700;letter-spacing:.02em;overflow-wrap:anywhere}
.pet-caption .look-label{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:5px;letter-spacing:.06em}
.look-chip{display:flex;align-items:center;gap:5px;border:3px solid var(--line);padding:7px 9px;font-size:10px;white-space:nowrap;background:var(--paper)}
.hero-under{display:flex;justify-content:space-between;gap:10px;font-size:9px;letter-spacing:.12em;color:var(--muted);padding:13px 2px 0;font-weight:700}
.side-stack{display:flex;flex-direction:column;gap:18px}
.adopt-panel{padding:28px}
.adopt-panel .eyebrow{color:var(--muted);margin-bottom:16px}
.adopt-panel h2{font-size:30px;line-height:1.3;margin-bottom:14px;font-weight:700}
.adopt-panel p{font-size:13px;color:var(--muted);line-height:1.9}
.name-label{font-size:12px;font-weight:700;display:flex;justify-content:space-between;margin:22px 0 9px;align-items:center}
.name-label span{font-size:10px;font-weight:400;color:var(--muted)}
.name-input{width:100%;background:var(--paper);border:3px solid var(--line);padding:13px 14px;font-size:16px;font-weight:700;min-width:0}
.name-input:focus{border-color:var(--ink);outline:none;background:#fffef6}
.input-error{font-size:12px;line-height:1.5;color:#8c2f26;margin-top:7px;min-height:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:12px 18px;border:3px solid var(--ink);font-size:13px;font-weight:700;letter-spacing:.08em;background:var(--panel)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-primary:hover{background:#000}
.btn-dark{background:var(--paper)}
.btn-dark:hover{background:var(--ink);color:var(--paper)}
.btn-quiet{border-color:var(--line);color:var(--muted)}
.btn-quiet:hover{border-color:var(--ink);color:var(--paper)}
a.btn{text-decoration:none}
.adopt-panel .btn{margin-top:15px}
.form-foot{display:flex;align-items:center;justify-content:center;gap:5px;font-size:10px;color:var(--muted);margin-top:12px}
.howto{padding:19px 21px}
.how-title{font-size:9px;letter-spacing:.16em;margin-bottom:15px;color:var(--muted);font-weight:700}
.steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.step-num{font-size:10px;border:3px solid var(--ink);width:26px;height:26px;display:grid;place-items:center;background:var(--faint);margin-bottom:8px;font-weight:700}
.step strong{font-size:12px;display:block;margin-bottom:5px}
.step p{font-size:10px;color:var(--muted);line-height:1.6}
.goal-panel{padding:24px;background:var(--panel);position:relative}
.section-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.section-top h2{font-size:15px;font-weight:700}
.section-top .small-meta{font-size:10px;color:var(--muted)}
.goal-panel .eyebrow{color:var(--muted)}
.goal-panel h2{font-size:21px;line-height:1.5;margin:6px 0;letter-spacing:.01em}
.goal-panel .goal-copy{font-size:12px;line-height:1.8;color:var(--muted)}
.progress-row{display:flex;align-items:center;gap:12px;margin:20px 0 16px}
.stamp-track{display:flex;align-items:center;gap:8px;flex:1}
.stamp{width:40px;height:40px;display:grid;place-items:center;border:2px dashed var(--line);background:var(--paper);color:var(--line)}
.stamp .icon{width:20px;height:20px}
.stamp.done{border:3px solid var(--ink);background:var(--ink);color:var(--paper)}
.track-line{width:18px;height:3px;background:var(--line)}
.track-line.done{background:var(--ink)}
.count{display:flex;align-items:center}
.count svg{image-rendering:pixelated}
.goal-panel .btn{min-height:45px;font-size:12px}
.collection{padding:22px}
.looks-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.look-option{padding:5px;background:var(--paper);min-width:0;text-align:center;border:3px solid var(--line)}
.look-thumb{aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center;background:var(--faint);overflow:hidden}
.look-thumb.music{background:#e2e5ea}.look-thumb.art{background:#ece2da}.look-thumb.market{background:#eae4cc}.look-thumb.evolved{background:#dcd7c2}
.look-thumb svg{width:92%;height:92%;image-rendering:pixelated}
.look-option.locked svg{opacity:.3}
.look-option.locked .look-thumb{background:repeating-conic-gradient(#26241c10 0% 25%,transparent 0% 50%) 0 0/6px 6px,var(--faint)}
.look-option.active{border-color:var(--ink);background:#fffef6}
.look-option.active .look-thumb{border:3px solid var(--ink)}
.look-option:hover{border-color:var(--ink)}
.look-name{display:block;margin-top:7px;font-size:10px;white-space:nowrap}
.lock-pin{position:absolute;right:4px;bottom:4px;width:18px;height:18px;display:grid;place-items:center;background:var(--paper);border:3px solid var(--ink);color:var(--ink)}
.lock-pin .icon{width:10px;height:10px}
.wear-pin{position:absolute;right:4px;top:4px;width:18px;height:18px;display:grid;place-items:center;background:var(--ink);color:var(--paper)}
.wear-pin .icon{width:10px;height:10px}
.collection-note{font-size:10px;color:var(--muted);line-height:1.8;margin-top:14px}
.quiet-note{font-size:11px;line-height:1.9;color:var(--muted);padding:14px 16px;border:2px dashed var(--line);background:var(--paper)}
.footer{display:flex;justify-content:space-between;align-items:center;border-top:3px solid var(--ink);margin-top:30px;padding:18px 0 24px;gap:15px;font-size:9px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.storage-warning{background:var(--panel);border:3px solid #8c6a1f;color:#5d4512;padding:10px 12px;font-size:12px;line-height:1.6;margin-top:16px}
.activity-heading .back-link{background:var(--panel);border:3px solid var(--ink);padding:9px 13px;font-size:11px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
.activity-heading .back-link:hover{background:var(--ink);color:var(--paper)}
.event-banner{border:3px solid var(--ink);background:var(--panel);margin-bottom:20px;position:relative;overflow:hidden}
.event-banner-main{padding:26px 28px;position:relative}
.event-tags{display:flex;gap:8px;align-items:center;font-size:9px;letter-spacing:.1em;margin-bottom:16px;font-weight:700}
.event-tag{border:3px solid var(--ink);padding:5px 8px;background:var(--paper)}
.event-wordmark-line{margin:4px 0 4px;overflow-x:auto}
.event-wordmark-line svg{image-rendering:pixelated;max-width:100%}
.event-sub{margin-top:12px;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.event-banner-side{display:flex;align-items:center;justify-content:center;border-top:3px solid var(--ink);background:repeating-conic-gradient(#26241c12 0% 25%,transparent 0% 50%) 0 0/8px 8px;min-height:120px}
.ticket-box{border:3px solid var(--ink);background:var(--panel);padding:14px 22px;display:flex;flex-direction:column;align-items:center;gap:8px}
.ticket-box .count{min-height:30px}
.ticket-box span{font-size:9px;letter-spacing:.14em;font-weight:700;color:var(--muted)}
.demo-notice{font-size:11px;color:var(--muted);line-height:1.8;border:2px dashed var(--line);padding:10px 13px;margin-bottom:18px;background:var(--paper)}
.spots-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.spot-card{border:3px solid var(--ink);background:var(--panel);display:flex;flex-direction:column;scroll-margin-top:25px}
.spot-card.focus-spot{outline:4px solid var(--ink);outline-offset:2px}
.spot-art{height:160px;position:relative;overflow:hidden;border-bottom:3px solid var(--ink)}
.spot-art.music{background:#dde1e9}.spot-art.art{background:#e9dcd3}.spot-art.market{background:#e6dfc4}
.spot-number{position:absolute;left:12px;top:12px;font-size:9px;letter-spacing:.12em;font-weight:700;background:var(--paper);border:3px solid var(--ink);padding:4px 6px;z-index:2}
.spot-word{position:absolute;left:12px;top:44px;z-index:1;opacity:.9}
.spot-word svg{image-rendering:pixelated}
.spot-art .pet-svg{position:absolute;width:120px;height:120px;right:10px;bottom:14px;image-rendering:pixelated;z-index:1}
.dither-band{position:absolute;left:0;right:0;bottom:0;height:26px;border-top:3px solid var(--ink);background:repeating-conic-gradient(#26241c2e 0% 25%,transparent 0% 50%) 0 0/6px 6px;z-index:0}
.claimed-flag{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:5px;border:3px solid var(--ink);background:var(--ink);color:var(--paper);padding:5px 7px;font-size:9px;letter-spacing:.1em;font-weight:700;z-index:2}
.claimed-flag .icon{width:11px;height:11px}
.spot-body{padding:18px;display:flex;flex-direction:column;gap:0;flex:1}
.spot-headline{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-bottom:9px}
.spot-headline h2{font-size:17px;font-weight:700}
.spot-zone{font-size:9px;letter-spacing:.12em;color:var(--muted);font-weight:700;white-space:nowrap;border:3px solid var(--line);padding:4px 6px}
.spot-reward{font-size:12px;line-height:1.8;margin-bottom:15px}
.spot-reward span{color:var(--muted)}
.spot-body .btn{font-size:11px;min-height:43px;margin-top:auto}
.route-note{display:flex;align-items:center;gap:10px;justify-content:center;padding:19px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.route-note button{font-size:11px;text-decoration:underline;text-underline-offset:3px;background:none;padding:0;font-weight:700;color:var(--ink)}
/* ---- offline note ---- */
.offline-note{border:2px dashed var(--line);background:var(--paper);color:var(--muted);font-size:11px;letter-spacing:.08em;padding:10px 13px;margin:0 0 16px;line-height:1.8;font-weight:700}
/* ---- pixel city map (去哪儿) ---- */
.map-wrap{position:relative;border:3px solid var(--ink);background:#ece8d6;overflow:hidden;margin-bottom:20px}
.city-svg{width:100%;height:auto;display:block}
.map-tag{position:absolute;top:10px;left:10px;font-size:9px;letter-spacing:.14em;font-weight:700;background:var(--paper);border:3px solid var(--ink);padding:4px 7px;color:var(--ink);z-index:3}
.map-legend{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:12px;border:3px solid var(--ink);background:var(--paper);padding:6px 9px;font-size:8px;letter-spacing:.1em;font-weight:700;color:var(--muted);z-index:3}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-swatch{width:9px;height:9px;border:3px solid var(--ink);background:var(--paper);flex:none}
.legend-swatch.done{background:var(--ink)}
.legend-swatch.here{border-color:var(--ink);background:var(--red);animation:blink 1.1s steps(1,end) infinite}

/* ===== V3 版画风重设计（2026-10）：冷灰纸 + 白卡片 + 硬投影 + LCD 宠物屏 + 红章语言 ===== */
:root{
  --paper:#D6D6D6;--panel:#FFFFFF;--ink:#1A1A1A;--muted:#5f5f5f;--line:#b0b0b0;--faint:#e9e9e9;
  --blue:#3E8EDE;--red:#E2483F;--yellow:#E5C32E;--green:#4FB14F;--pink:#FF87C3;--purple:#9B72CB;--accent:#E2483F;
  --hard:4px 4px 0 var(--ink);
}
body{background:var(--paper);background-image:repeating-conic-gradient(#1a1a1a08 0% 25%,transparent 0% 50%);background-size:6px 6px}
/* 纸张颗粒（盖全屏，不挡交互） */
body::after{content:"";position:fixed;inset:0;z-index:2000;pointer-events:none;opacity:.1;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
/* 硬投影卡片族 */
.btn,.panel,.pet-card,.goal-panel,.adopt-panel,.howto,.collection,.set-panel,.spot-card,.event-banner,.dialog,.live-frame,.album-card,.ticket-box,.near-tabs,.mobile-nav,.desktop-nav,.map-wrap,.map-holder,.offline-note,.demo-notice,.geo-note,.storage-warning,.reward-progress,.checkin-frame,.quiet-note{box-shadow:var(--hard)}
.btn{border:3px solid var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.dialog{box-shadow:8px 8px 0 var(--ink)}
.dialog::backdrop{background:rgba(26,26,26,.55)}
/* 语义色：主行动=绿 / 导航激活=粉（品牌） / 完成·盖章=红 / 进行中=黄 */
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:#3F9440;color:#fff}
.nav-btn[aria-current="page"]{background:var(--pink);color:var(--ink)}
.near-tab-btn.on{background:var(--blue);color:#fff}
/* LCD 宠物屏（扫描线 + 内阴影 + 厚边框） */
.pet-canvas{border:6px solid var(--ink);box-shadow:var(--hard),inset 0 0 26px rgba(0,0,0,.16);background-color:#A9B295;background-image:linear-gradient(rgba(26,26,26,.1) 50%,transparent 50%),linear-gradient(90deg,rgba(255,60,60,.03),rgba(60,255,60,.02),rgba(60,60,255,.03));background-size:100% 3px,3px 100%}
.pet-canvas.music{background-color:#A3B0A6}.pet-canvas.art{background-color:#B1B19B}.pet-canvas.market{background-color:#AEB092}
.pet-canvas.evolved{background-color:#242424;background-image:linear-gradient(rgba(255,255,255,.08) 50%,transparent 50%);background-size:100% 3px;color:#fff}
.look-thumb{background:#cdd3c2}
.look-thumb.music{background:#c2cdd4}.look-thumb.art{background:#d4cbc2}.look-thumb.market{background:#d1ccb4}.look-thumb.evolved{background:#bdbdbd}
.reward-stage{background-color:#cdd3c2}
.reward-stage.music{background-color:#c2cdd4}.reward-stage.art{background-color:#d4cbc2}.reward-stage.market{background-color:#d1ccb4}.reward-stage.base{background-color:#cdd3c2}
.reward-stage.spec{background-color:var(--faint)}
.spot-art.music{background:#c2cdd4}.spot-art.art{background:#d4cbc2}.spot-art.market{background:#d1ccb4}
/* 印章语言：集章格 / 打卡奖励章 / 地图完成 / 已得标记 → 红色圆章 */
.stamp{border-radius:50%;border:2px dashed #a3a3a3;color:#a3a3a3;background:var(--panel)}
.stamp.done{border:3px solid var(--red);border-radius:50%;background:var(--panel);color:var(--red);transform:rotate(-12deg)}
.stamp.done .icon{width:18px;height:18px}
.reward-stamp{border:3px solid var(--red);border-radius:50%;background:var(--panel);color:var(--red);transform:rotate(-12deg);padding:8px 10px}
.reward-stage.evolved .reward-stamp{background:var(--panel);color:var(--red)}
.claimed-flag{background:var(--red)}
.map-marker.done{background:var(--red);color:#fff}
.legend-swatch.done{background:var(--red);border:2px solid var(--ink)}
.you-dot{background:var(--pink)}
.map-canvas .you-dot{background:var(--pink)}
.live-dot{background:var(--green)}
.screen-badge.hungry{background:var(--red);color:#fff}
/* 拍立得照片框（下白边加厚） */
.live-frame{padding:6px 6px 14px}
.detail-photo{padding:8px 8px 18px}
/* 微件回归：小元素保持 2px 边框，避免糊死 */
.cmt-dot{border:2px solid var(--paper)}
.legend-swatch{border:2px solid var(--ink)}
.lang-btn,.icon-btn,.map-refresh,.corner-badge{border:2px solid var(--ink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ink)}

/* ===== V3.1 设计稿对齐（六屏像素志 · 2026-10）：Courier 900 / 粉斜纹 / DNA 条 / 导航图标盒 / 大圆章 / 票根 / 传单头 ===== */
html{font-family:'Courier New',Courier,ui-monospace,Menlo,monospace}
body{font-family:'Courier New',Courier,ui-monospace,Menlo,monospace;background-image:linear-gradient(45deg,rgba(255,135,195,.05) 25%,transparent 25%),linear-gradient(-45deg,rgba(255,135,195,.05) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(255,135,195,.05) 75%),linear-gradient(-45deg,transparent 75%,rgba(255,135,195,.05) 75%);background-size:40px 40px}
.site-header,h1,h2,h3,.page-intro h1,.section-top h2,.spot-headline h2,.set-panel h2,.adopt-panel h2,.goal-panel h2,.modal-inner h2{font-weight:900}
.page-intro h1{letter-spacing:-.02em}
.brand svg{filter:drop-shadow(2px 2px 0 var(--pink))}
.status-pill{display:inline-block;background:var(--ink);color:#fff;padding:2px 7px;font-size:9px;font-weight:900;letter-spacing:.1em;margin-top:5px;text-transform:uppercase;width:max-content}
.stats-strip{display:flex;gap:2px}
.stat-box{border:3px solid var(--ink);padding:3px 8px;background:#fff;display:flex;flex-direction:column;justify-content:center;min-width:58px;box-shadow:2px 2px 0 var(--ink)}
.stat-label{font-size:8px;font-weight:900;letter-spacing:.1em;color:var(--muted)}
.stat-value{font-size:13px;font-weight:900}
/* DNA 色条（屏幕左缘） */
.dna-bar{position:fixed;left:0;top:22%;width:12px;display:flex;flex-direction:column;border-right:3px solid var(--ink);z-index:15;pointer-events:none}
.dna-cell{height:20px;width:100%;border-bottom:1px solid var(--ink)}
.dna-cell:nth-child(5n+1){background:var(--yellow)}
.dna-cell:nth-child(5n+2){background:var(--green)}
.dna-cell:nth-child(5n+3){background:var(--blue)}
.dna-cell:nth-child(5n+4){background:var(--purple)}
.dna-cell:nth-child(5n+5){background:var(--pink)}
/* 底部导航：图标盒 + 文案（设计稿 nav-box） */
.mobile-nav{gap:2px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.mobile-nav .nav-btn{flex-direction:column;gap:4px;border-right:0;background:none;font-size:10px;font-weight:900;letter-spacing:.04em;color:var(--ink);min-height:0;padding:4px 2px}
.nav-box{width:32px;height:32px;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;flex:none}
.nav-box .icon{width:16px;height:16px}
.mobile-nav .nav-btn[aria-current="page"]{background:none;color:var(--ink)}
.mobile-nav .nav-btn[aria-current="page"] .nav-box{background:var(--pink);box-shadow:2px 2px 0 var(--ink)}
.desktop-nav .nav-btn{display:flex;align-items:center;gap:7px}
.desktop-nav .nav-box{width:22px;height:22px;border-width:2px}
.desktop-nav .nav-box .icon{width:11px;height:11px}
/* 打卡成功 · 大圆章时刻（设计稿 STAMP MOMENT） */
.stamp-seal{position:relative;width:150px;height:150px;margin:6px auto 2px;display:grid;place-items:center;flex:none}
.stamp-seal .seal-ring{position:absolute;inset:0;width:118px;height:118px;margin:auto;border:4px solid var(--red);border-radius:50%;display:grid;place-items:center;transform:rotate(-12deg);background:rgba(226,72,63,.05);color:var(--red)}
.stamp-seal .seal-ring::before{content:"";position:absolute;inset:4px;border:1px solid var(--red);border-radius:50%}
.stamp-seal .seal-inner{display:flex;flex-direction:column;align-items:center;gap:2px;transform:rotate(-12deg);z-index:1}
.stamp-seal .seal-arc{font-size:7px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
.stamp-seal .seal-code{font-size:22px;font-weight:900;line-height:1}
.stamp-seal .seal-date{font-size:9px;font-weight:900;border-top:1px solid var(--red);padding-top:2px}
.stamp-seal .impact{position:absolute;background:var(--ink);width:2px;height:16px;border-radius:2px}
.stamp-seal .i1{top:-6px;left:50%}
.stamp-seal .i2{top:16px;right:2px;transform:rotate(45deg)}
.stamp-seal .i3{bottom:16px;right:2px;transform:rotate(135deg)}
.stamp-seal .i4{bottom:-6px;left:50%;transform:rotate(180deg)}
.stamp-seal .i5{bottom:16px;left:2px;transform:rotate(225deg)}
.stamp-seal .i6{top:16px;left:2px;transform:rotate(315deg)}
.stamp-seal .sparkle{position:absolute;color:var(--yellow);font-size:18px;font-weight:900;z-index:2}
.stamp-seal .s1{top:6%;left:8%}
.stamp-seal .s2{bottom:12%;right:6%;font-size:13px}
.reward-moment{display:flex;align-items:center;gap:8px;margin:14px 0;border:3px solid var(--ink);background:var(--paper);padding:12px;box-shadow:var(--hard)}
.reward-moment .stamp-seal{margin:0}
.reward-moment .reward-stage{flex:1;min-width:0;height:172px;margin:0;border-width:3px;box-shadow:none}
.reward-moment .reward-stage .pet-svg{width:148px;height:148px}
.reward-moment .reward-stage .stage-label{display:none}
.feed-panel{padding:14px 16px}
/* 拍立得红章（相册 Visited/Obtained） */
.live-frame{position:relative;transform:rotate(-.8deg)}
.live-grid .live-frame:nth-child(even){transform:rotate(.8deg)}
.live-frame[data-stamp]::after{content:attr(data-stamp);position:absolute;top:8px;right:8px;border:2px solid var(--red);color:var(--red);background:rgba(226,72,63,.08);font-size:8px;font-weight:900;letter-spacing:.08em;padding:2px 4px;text-transform:uppercase;transform:rotate(12deg);pointer-events:none;z-index:3}
/* 到店凭证 · 票根（设计稿 ticket stub） */
.ticket{display:flex;align-items:stretch;border:3px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);margin-bottom:10px;position:relative;min-height:58px}
.ticket-main{flex:1;padding:9px 12px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.ticket-code{font-size:17px;font-weight:900;letter-spacing:.18em;line-height:1}
.ticket-name{font-size:10px;color:var(--muted);font-weight:700}
.ticket-stub{width:58px;border-left:2px dashed var(--ink);display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#1a1a1a08 0% 25%,transparent 0% 50%) 0 0/6px 6px;flex:none}
.ticket::before,.ticket::after{content:"";position:absolute;right:47px;width:10px;height:10px;background:var(--paper);border:3px solid var(--ink);border-radius:50%}
.ticket::before{top:-8px}
.ticket::after{bottom:-8px}
.ticket-stamp{width:34px;height:34px;border:2px solid var(--purple);border-radius:50%;color:var(--purple);font-size:6px;font-weight:900;display:grid;place-items:center;transform:rotate(-15deg);text-align:center;line-height:1.2}
/* 活动页 · 传单头（设计稿 flyer-visual：木刻纹 + 暗底 + 底部渐显） */
.event-banner{background:#232323;color:#fff;box-shadow:var(--hard)}
.event-banner::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,transparent,transparent 2px,rgba(255,255,255,.045) 2px,rgba(255,255,255,.045) 4px);pointer-events:none}
.event-banner::after{content:"";position:absolute;inset:auto 0 0 0;height:56%;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.55));pointer-events:none}
.event-banner-main{position:relative;z-index:1}
.event-banner .event-tag{background:var(--yellow);border-color:var(--ink);color:var(--ink)}
.event-banner .event-sub{color:#cfcfcf}
.event-host{font-size:9px;letter-spacing:.16em;font-weight:900;opacity:.75;margin-bottom:8px;color:#fff}
.event-banner-side{background:#1a1a1a}
.event-banner-side .ticket-box{box-shadow:none}
.spot-art{background-color:#333}
.spot-art.music{background-color:#3E4147}.spot-art.art{background-color:#453F3A}.spot-art.market{background-color:#3F3B2E}
.spot-art .spot-word,.spot-art .dither-band{opacity:.85}
/* 集章格（点位集章册） */
.stamp-track .stamp.done{box-shadow:2px 2px 0 var(--ink)}
@media(max-width:700px){
.status-pill{display:none}
.stats-strip{display:flex}
.stat-box{min-width:48px;padding:2px 6px;border-width:2px}
.stat-label{font-size:7px}
.stat-value{font-size:11px}
.dna-bar{top:16%}
.stamp-seal{width:132px;height:132px}
.stamp-seal .seal-ring{width:104px;height:104px}
.stamp-seal .seal-code{font-size:19px}
.reward-moment{flex-direction:column}
.reward-moment .reward-stage{width:100%;height:150px}
.reward-moment .reward-stage .pet-svg{width:130px;height:130px}
.mobile-nav{padding:8px 10px}
.mobile-nav .nav-btn{padding:6px 2px}
.ticket::before,.ticket::after{right:44px}
}

/* ===== V3.2 布局重构（2026-10 · 六屏版式对齐）：全局手机列 + 屏标题 + 全屏宠物屏 + 动作格 + 集章册 + 照片墙 + 标本卡 ===== */
.shell{max-width:452px;padding:0 14px}
.site-header{min-height:0;padding:12px 0 10px}
.brand-caption{display:none}
.desktop-nav{display:none!important}
.footer{justify-content:center;gap:14px;margin-top:26px}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.main-grid{display:flex;flex-direction:column;gap:16px}
.mobile-nav{display:flex;position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(364px,calc(100% - 24px));background:var(--panel);border:3px solid var(--ink);box-shadow:var(--hard);z-index:20}
/* 屏标题（EXPLORE / Archive / Profile / EVENT） */
.screen-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:16px 0 12px}
.screen-title{font-size:32px;font-weight:900;line-height:.9;letter-spacing:-2px;text-transform:uppercase;color:var(--ink);text-shadow:2px 2px 0 var(--pink)}
.screen-pill{display:inline-block;background:var(--ink);color:#fff;padding:2px 6px;font-size:10px;font-weight:900;letter-spacing:.06em;margin-top:5px;text-transform:uppercase}
.screen-tag{display:inline-block;border:3px solid var(--ink);background:var(--blue);color:#fff;padding:2px 7px;font-size:9px;font-weight:900;letter-spacing:.1em;margin-top:6px}
.mini-stats{display:flex;gap:2px;flex:none}
.uid-block{text-align:right;display:flex;flex-direction:column;gap:2px}
.uid-main{font-size:13px;font-weight:900}
.uid-sub{font-size:9px;color:var(--muted);font-weight:700}
.back-link{border:3px solid var(--ink);background:var(--panel);padding:8px 12px;font-size:11px;font-weight:900;letter-spacing:.06em;box-shadow:2px 2px 0 var(--ink);flex:none}
.back-link:active{transform:translate(2px,2px);box-shadow:none}
/* 首页：全屏宠物屏 + 附近活动卡 + 动作格 + 日志 */
.pet-card{border:0;background:transparent;padding:0}
.pet-canvas{aspect-ratio:1/1;height:auto;border-width:8px;box-shadow:var(--hard)}
.pet-touch{width:min(72%,300px);height:min(70%,290px)}
.pet-caption{border:3px solid var(--ink);border-top:0;background:var(--panel);padding:10px 12px;margin:0}
.look-chip{border-width:2px}
.nearby-card{display:flex;align-items:center;gap:12px;padding:12px;text-align:left;box-shadow:var(--hard)}
.event-ico{width:52px;height:52px;flex:none;border:3px solid var(--ink);background:var(--blue);display:grid;place-items:center;font-size:24px}
.nearby-info{flex:1;min-width:0}
.nearby-info h3{font-size:14px;font-weight:900;margin:2px 0}
.nearby-info p{font-size:10px;color:var(--muted);font-weight:700}
.nearby-tag{display:inline-block;font-size:8px;font-weight:900;letter-spacing:.08em;background:var(--yellow);border:2px solid var(--ink);padding:1px 5px}
.nearby-arrow{font-size:13px;font-weight:900;color:var(--green);flex:none}
.nearby-wrap{position:relative}
.rec-reroll{position:absolute;top:8px;right:8px;width:26px;height:26px;border:2px solid var(--ink);background:var(--panel);font-size:13px;font-weight:900;box-shadow:2px 2px 0 var(--ink);display:grid;place-items:center;z-index:2;padding:0}
.rec-reroll:active{transform:translate(2px,2px);box-shadow:none}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-act{border:3px solid var(--ink);box-shadow:var(--hard);padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:74px;justify-content:center}
.btn-act:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn-act:disabled{cursor:default}
.act-title{font-size:15px;font-weight:900;letter-spacing:.02em}
.act-sub{font-size:10px;font-weight:700;opacity:.85}
.act-go{background:var(--pink);color:var(--ink)}
.act-feed{background:var(--yellow);color:var(--ink)}
.act-cam{background:var(--green);color:#fff}
.act-pet{background:var(--panel);color:var(--ink)}
.act-log{border:2px dashed var(--ink);padding:10px 12px;background:rgba(255,255,255,.4)}
/* 摸头动效：按钮弹跳 + 宠物弹跳 + 爱心 + 星星迸发 + 画布微震 */
.btn-act.boop{animation:act-boop .55s steps(6,end) 1}
@keyframes act-boop{0%{transform:scale(1)}16%{transform:scale(.82) rotate(-2.6deg)}44%{transform:scale(1.09) rotate(1.4deg)}72%{transform:scale(.94)}100%{transform:scale(1)}}
.pet-canvas.shake{animation:canvas-shake .26s steps(2,end) 1}
@keyframes canvas-shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,0)}}
/* hop2 特异度必须压过 .pet-canvas.mood-* .pet-svg 待机动画，否则摸头时宠物不跳 */
.pet-canvas .pet-touch.hop svg{animation:hop2 .62s steps(1,end) 1}
@keyframes hop2{0%,14%{transform:translateY(0) scaleY(1)}15%,39%{transform:translateY(-22px) scaleY(1.04)}40%,44%{transform:translateY(0) scaleY(.88)}45%,54%{transform:translateY(0) scaleY(1)}55%,79%{transform:translateY(-12px)}80%,83%{transform:translateY(0) scaleY(.93)}84%,100%{transform:translateY(0) scaleY(1)}}
.touch-fx{position:absolute;left:50%;bottom:44%;width:0;height:0;pointer-events:none;z-index:6}
.touch-fx i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;background:var(--c);clip-path:polygon(50% 0,64% 36%,100% 50%,64% 64%,50% 100%,36% 64%,0 50%,36% 36%);animation:star-burst .55s steps(5,end) both}
.touch-fx i:nth-child(1){--c:var(--yellow);--tx:-44px;--ty:-34px;--r:140deg}
.touch-fx i:nth-child(2){--c:var(--pink);--tx:44px;--ty:-34px;--r:-140deg}
.touch-fx i:nth-child(3){--c:var(--blue);--tx:-52px;--ty:6px;--r:90deg}
.touch-fx i:nth-child(4){--c:var(--green);--tx:52px;--ty:6px;--r:-90deg}
@keyframes star-burst{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}100%{transform:translate(var(--tx,0),var(--ty,0)) scale(1.2) rotate(var(--r,0));opacity:0}}
.log-title{font-size:10px;font-weight:900;letter-spacing:.12em;margin-bottom:8px}
.log-row{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:700;padding:5px 0;border-top:1px dashed rgba(26,26,26,.25)}
.log-row:first-of-type{border-top:0}
.log-tag{background:var(--ink);color:#fff;font-size:8px;padding:1px 4px;margin-right:4px}
.log-val{color:var(--green);flex:none}
.home-panels{display:flex;flex-direction:column;gap:16px;margin-top:16px}
/* 首页状态胶囊条（详情收进弹窗，降低首屏认知负担） */
.status-strip{display:flex;align-items:center;gap:8px;margin-top:14px;border:2px dashed var(--ink);padding:8px 10px;background:rgba(255,255,255,.4)}
.strip-chip{font-size:11px;font-weight:900;letter-spacing:.04em}
.strip-more{margin-left:auto;background:var(--ink);color:#fff;border:2px solid var(--ink);padding:5px 12px;font-size:11px;font-weight:900;flex:none}

/* 我的页低频抽屉 */

.more-body{display:flex;flex-direction:column;gap:14px;padding:0 10px 12px}
.dialog .panel{box-shadow:none}
/* 活动页：传单 + CHECK IN + 集章册 + 点位行 + 照片墙 */
.event-flyer{position:relative;border:3px solid var(--ink);background:#232323;color:#fff;padding:20px 18px 24px;box-shadow:var(--hard);overflow:hidden}
.event-flyer::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,transparent,transparent 2px,rgba(255,255,255,.045) 2px,rgba(255,255,255,.045) 4px);pointer-events:none}
.event-flyer::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.6));pointer-events:none}
.event-flyer>*{position:relative;z-index:1}
.event-flyer .event-host{font-size:9px;letter-spacing:.16em;font-weight:900;opacity:.75;color:#fff;margin-bottom:10px}
.event-flyer .event-wordmark-line svg{max-width:100%}
.event-flyer .event-sub{color:#cfcfcf;font-size:11px;font-weight:700;margin-top:10px}
.flyer-ring{position:absolute;top:14px;right:14px;width:40px;height:40px;border:2px solid #fff;border-radius:50%;opacity:.3;z-index:1}
.checkin-hero{display:flex;align-items:center;gap:16px;padding:20px 0 16px;border-bottom:2px dashed var(--ink)}
.btn-checkin{flex:1;min-height:64px;background:var(--green);color:#fff;border:3px solid var(--ink);box-shadow:var(--hard);font-size:18px;font-weight:900;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-checkin:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.event-stamp{width:72px;height:72px;flex:none;border:3px solid var(--red);border-radius:50%;color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-15deg);position:relative;padding:4px}
.event-stamp::before{content:"";position:absolute;inset:3px;border:1px solid var(--red);border-radius:50%}
.event-stamp .stamp-top{font-size:5px;font-weight:900;letter-spacing:.04em}
.event-stamp .stamp-date{font-size:14px;font-weight:900}
.booklet{padding:16px}
.booklet-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stamp-slot{aspect-ratio:1;border:2px dashed #999;background:rgba(255,255,255,.45);display:grid;place-items:center;padding:0;min-width:0}
.stamp-slot .slot-no{font-size:12px;font-weight:900;color:#999}
.stamp-slot.filled{border:3px solid var(--red);background:var(--panel);color:var(--red);transform:rotate(-6deg);box-shadow:2px 2px 0 var(--ink)}
.stamp-slot.filled .icon{width:55%;height:55%}
.stamp-slot.bonus{border-style:dotted;border-color:var(--purple)}
.stamp-slot.bonus.filled{border:3px solid var(--purple);color:var(--purple);background:var(--panel)}
.booklet-note{font-size:10px;font-weight:700;margin-top:10px}
.spot-rows{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.spot-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:3px solid var(--ink);padding:10px 12px;box-shadow:3px 3px 0 var(--ink);scroll-margin-top:16px}
.spot-row.focus-spot{outline:4px solid var(--ink);outline-offset:2px}
.row-no{font-size:12px;font-weight:900;color:var(--muted);flex:none}
.row-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-info strong{font-size:13px;font-weight:900}
.row-hint{font-size:9px;color:var(--muted);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-mini{border:3px solid var(--ink);padding:8px 14px;font-size:12px;font-weight:900;letter-spacing:.06em;flex:none;box-shadow:2px 2px 0 var(--ink)}
.btn-mini:active{transform:translate(2px,2px);box-shadow:none}
.btn-go{background:var(--green);color:#fff}
.btn-lock{background:#BBB;color:#666;border-color:#777;box-shadow:none;cursor:default}
.btn-stamped{background:var(--panel);color:var(--red);border-color:var(--red);transform:rotate(-4deg)}
.photo-wall{padding:16px;background:#CECECE}
.wall-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 14px}
.wall-item{border:1px solid var(--ink);background:#fff;padding:3px 3px 8px;box-shadow:2px 2px 0 rgba(0,0,0,.12);min-width:0}
.wall-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--faint)}
.btn-capture{width:100%;background:var(--ink);color:#fff;padding:15px;border:3px solid var(--ink);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-capture:active{opacity:.85}
/* 相册页 */
.filter-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.filter-scroll::-webkit-scrollbar{display:none}
.filter-tag{flex:none;padding:5px 10px;background:var(--panel);border:2px solid var(--ink);font-size:10px;font-weight:900;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
button.filter-tag:active{transform:translate(2px,2px);box-shadow:none}
.filter-tag.active{background:var(--ink);color:#fff}
.filter-tag.dim{opacity:.45;box-shadow:none}
.archive-section{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.section-header{display:flex;justify-content:space-between;align-items:center;border-left:6px solid var(--ink);padding-left:8px}
.section-title{font-size:12px;font-weight:900}
.section-date{font-size:10px;color:var(--muted);font-weight:700}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.photo-grid .live-frame:nth-child(even){transform:rotate(.8deg)}
.empty-state{text-align:center;padding:36px 20px;border:2px dashed #999;color:#888;font-size:11px;font-weight:700;line-height:2}
/* 我的页 */
.mine-stack{display:flex;flex-direction:column;gap:16px}
.specimen-card{padding:18px;position:relative;box-shadow:6px 6px 0 var(--ink)}
.specimen-no{position:absolute;top:10px;left:10px;font-size:10px;font-weight:900}
.btn-change{position:absolute;right:10px;top:10px;background:var(--blue);color:#fff;font-size:9px;font-weight:900;padding:5px 8px;border:2px solid var(--ink)}
.btn-change:active{opacity:.85}
.specimen-frame{border:1px solid var(--ink);margin:22px 0;padding:26px;display:grid;place-items:center;position:relative}
.specimen-frame::before,.specimen-frame::after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--ink)}
.specimen-frame::before{top:-5px;left:-5px}
.specimen-frame::after{bottom:-5px;right:-5px}
.specimen-frame svg{width:110px;height:110px;image-rendering:pixelated}
.specimen-footer{text-align:center;border-top:1px solid #ddd;padding-top:10px}
.specimen-title{font-size:12px;font-weight:900}
.specimen-date{font-size:9px;color:#888;margin-top:2px}
.mine-block .section-header-h{font-size:13px;font-weight:900;margin-bottom:10px;text-transform:uppercase;border-left:6px solid var(--pink);padding-left:8px}
.his-list{padding:12px;display:flex;flex-direction:column}
.his-row{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:700;padding:8px 0;border-bottom:1px dashed rgba(26,26,26,.2)}
.his-row:last-child{border-bottom:0}
.his-val{color:var(--muted);flex:none}
.utility-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* 活动列表页：进行中 hero + 返回栏 */
.event-hero{padding:16px;box-shadow:var(--hard)}
.event-hero .event-hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.event-hero h2{font-size:18px;font-weight:900;margin:0 0 4px}
.event-hero .modal-actions{margin:12px 0 0}
.event-back{margin:0 0 12px}
.util-btn{background:var(--panel);border:2px solid var(--ink);padding:12px 10px;font-size:11px;font-weight:900;text-align:center;box-shadow:2px 2px 0 var(--ink)}
/* ===== V3.3 示例稿排版对齐（首页/地图/相册/我的/活动页 + 头部） ===== */
.logo-area{display:flex;flex-direction:column;align-items:flex-start}
.logo-text{font-size:30px;font-weight:900;line-height:.9;letter-spacing:-2px;text-transform:uppercase;text-shadow:2px 2px 0 var(--pink)}
.site-header{align-items:flex-start;min-height:0;padding:16px 0 12px;gap:12px}
.status-pill{display:inline-block!important}
.status-pill.mode-map{background:none;color:var(--blue);padding:0;margin-top:4px;box-shadow:none}
.stats-strip{gap:2px}
.stat-box{min-width:60px}
.footer{display:none!important}
main{position:relative;padding-top:16px}

.pet-topline,.pet-caption,.ground,.pet-canvas .deco,.screen-badge{display:none!important}
.pet-card{border:0!important;background:transparent!important;padding:0!important;box-shadow:none!important;position:static!important}

.nearby-card{padding:12px}
.rec-reroll{top:-10px;right:-10px}

.act-log{border:0!important;border-top:2px dashed var(--ink)!important;background:none!important;padding:10px 0 0!important;box-shadow:none!important}

.compass{position:absolute;top:10px;right:10px;width:36px;height:36px;border:3px solid var(--ink);background:var(--panel);box-shadow:2px 2px 0 var(--ink);display:grid;place-items:center;font-weight:900;font-size:15px;z-index:6}
.where-am-i{position:absolute;left:10px;bottom:10px;background:var(--ink);color:var(--paper);font-size:8px;font-weight:900;letter-spacing:.14em;padding:4px 7px;z-index:6}

.scale-text{font-size:8px;font-weight:900;background:var(--panel);padding:1px 4px;border:2px solid var(--ink)}
.scale-bar{width:46px;height:5px;border:2px solid var(--ink);border-top:0;background:var(--panel)}
.map-credit{bottom:36px}
/* 活动页浮动返回键 */
.back-btn{position:absolute;top:10px;left:10px;z-index:5;width:38px;height:38px;border:3px solid var(--ink);background:var(--panel);box-shadow:2px 2px 0 var(--ink);font:900 15px/1 inherit;display:grid;place-items:center}
.back-btn:active{transform:translate(2px,2px);box-shadow:none}
/* 语言菜单改为全局浮层（入口在 我的→LANG） */
.lang-menu{position:fixed;top:64px;right:14px}
/* ===== V3.4 按设计说明逻辑重排：TRADE/摸头提示/GO-LOCK/账本工作台/票根 ===== */
.act-trade{background:var(--panel);color:var(--ink)}
.pet-hint{margin:10px 2px 0;font-size:10px;font-weight:900;letter-spacing:.08em;color:var(--muted);text-align:center}
.btn-mini.btn-lock{background:#c9c9c9;color:#666;border-color:#8f8f8f;cursor:not-allowed}
.wb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.wb-head h3{font-size:18px;font-weight:900}
.wb-mode{color:var(--blue);font-size:10px;font-weight:900;letter-spacing:.12em;margin-bottom:3px}
.wb-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.wb-stat{border:3px solid var(--ink);background:var(--panel);box-shadow:var(--hard);padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:3px}
.wb-stat .mono{font-size:8px;color:var(--muted);letter-spacing:.06em}
.wb-stat strong{font-size:20px;font-weight:900;line-height:1}

.wb-chart-panel{padding:14px}
.wb-chart{height:110px;display:flex;align-items:flex-end;justify-content:space-around;gap:6px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:0 6px;background-image:linear-gradient(to bottom,rgba(26,26,26,.08) 1px,transparent 1px);background-size:100% 22px}
.wb-bar{width:22px;background:var(--green);border:2px solid var(--ink);position:relative;min-height:6px}

.wb-chart-days{display:flex;justify-content:space-around;font-size:8px;color:var(--muted);margin-top:4px}
.wb-ticket{border:3px solid var(--ink);background:var(--panel);box-shadow:var(--hard);padding:14px;margin-bottom:12px;position:relative}
.wb-ticket::before,.wb-ticket::after{content:"";position:absolute;right:41px;width:12px;height:12px;background:var(--paper);border:2px solid var(--ink);border-radius:50%;z-index:2}

.wb-ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

.wb-badge{flex:none;border:2px solid var(--ink);padding:2px 6px;font-size:9px;font-weight:900}
.wb-badge.on{background:var(--green);color:#fff}
.wb-badge.off{background:#c9c9c9;color:#555}
.wb-ticket-dash{border-top:2px dashed var(--ink);margin:10px -14px}
.wb-ticket-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.wb-redeem{display:flex;gap:8px;align-items:center;margin-left:auto}
.stamp-btn{width:58px;height:58px;border:3px solid #E54B4B;border-radius:50%;background:transparent;color:#E54B4B;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8px;font-weight:900;transform:rotate(-10deg);box-shadow:2px 2px 0 rgba(229,75,75,.3);padding:0}

.stamp-btn:active{transform:rotate(-10deg) scale(.92)}
.wb-create-bar{width:100%;background:var(--ink);color:var(--paper);border:0;padding:15px;font-size:15px;font-weight:900;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--hard);margin-top:6px}
.wb-create-bar span{font-size:22px;line-height:1}

.evt-about-text{-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.hall-card{margin:14px 0}

.mine-block{margin-bottom:20px}
.archive-section{margin-bottom:24px}
.evt-slot{min-height:52px}
.wb-geo{border:3px solid var(--ink);background:var(--panel);box-shadow:2px 2px 0 var(--ink);padding:10px 12px;font-size:11px;font-weight:700;line-height:1.6;margin-bottom:12px}

.wb-geo.ok{background:#e9f6e9}
.wb-look{border-top:2px dashed var(--line);margin-top:6px;padding-top:6px}
.wb-look summary{font-size:10px;font-weight:900;color:var(--muted);cursor:pointer;letter-spacing:.08em}
.wb-look[open] summary{margin-bottom:8px}
/* ===== V3.5 活动大厅 + 活动详情页 + 打卡成功 ===== */
.mobile-nav .nav-btn[data-view="events"]{margin-top:-20px}
.mobile-nav .nav-btn[data-view="events"] .nav-box{width:46px;height:46px;border-radius:50%;background:var(--pink);border-width:3px;box-shadow:3px 3px 0 var(--ink)}
.mobile-nav .nav-btn[data-view="events"] .nav-box .icon{width:20px;height:20px}
.hall-search{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);background:var(--panel);box-shadow:2px 2px 0 var(--ink);padding:10px 12px;margin-bottom:12px}

.hall-pills::-webkit-scrollbar{display:none}
.hall-pill{flex:none;border:3px solid var(--ink);background:var(--panel);box-shadow:2px 2px 0 var(--ink);border-radius:999px;padding:8px 16px;font-size:12px;font-weight:900}

.hall-sec-tag{display:inline-block;background:var(--ink);color:var(--paper);font-size:9px;font-weight:900;letter-spacing:.12em;padding:2px 6px;margin:16px 0 4px;vertical-align:middle}

.hall-dist{font-size:10px;color:var(--blue);font-weight:700}
.hall-badge{align-self:flex-start;font-size:9px;font-weight:900;border:2px solid var(--ink);padding:1px 6px;margin-top:2px}

.hall-progress{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:900;margin-top:2px}

const ERR_SAFE_KEYS=['需到点位','距活动点位','获取定位失败','饲料不够','只有发布者','匿名打卡24小时后无法删除','每日最多只能上传','距拍照地点','无权删除这张照片','已被注册','密码至少','邮箱格式','用户名或密码错误','用户名和密码都是必需的','设备已注册','照片文件为空','照片数据校验失败','照片源文件已丢失','GitHub账号已绑定其他用户','未能获取你的位置','请先领养宠物','评论发送过快','同步过于频繁','步数数据无效','绑定码错误或已过期'];
function errText(error){
  const raw=error&&error.message?String(error.message):'';
  if(raw)console.warn('[outie api]',raw);
  if(error&&error.name==='AbortError')return '网络超时。请稍后重试';
  if(ERR_SAFE_KEYS.some(k=>raw.includes(k)))return raw;
  if(/定位|位置|坐标|高德/.test(raw))return '定位暂时不可用。点地图右上角「刷新」重试';
  if(/photo|upload|照片/i.test(raw))return '照片服务暂时不可用，请稍后重试';
  if(/comment|评论/i.test(raw))return '评论暂不可用。请稍后重试';
  if(/token|身份|登录|user not found/i.test(raw))return '登录状态已过期，请重新登录';
  if(/github/i.test(raw))return 'GitHub 登录暂未开通。请先用邮箱登录。';
  return '操作失败，请稍后重试';
}
async function apiFetch(path,options={},timeoutMs=12000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{
    const res=await fetch(API_BASE+path,{
      ...options,
      signal:controller.signal,
      headers:{...authHeaders(),...(options.headers||{})}
    });
    let data={};
    try{data=await res.json();}catch(e){}
    if(!res.ok){
      /* 悬空登录态自愈：token 无效或对应账号已不存在时清掉，立即匿名重试一次 */
      const dangling=res.status===401||(res.status===404&&/user not found/i.test(String(data.error||'')));
      if(dangling&&authToken()){
        try{localStorage.removeItem('outie.auth-token');}catch(e){}
        authUser=null;
        clearTimeout(timer);
        return apiFetch(path,options,timeoutMs);
      }
      const error=new Error(data.error||('请求失败（HTTP '+res.status+'）'));
      error.status=res.status;error.payload=data;throw error;
    }
    return data;
  }finally{clearTimeout(timer);}
}
async function probeApi(){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),10000);
  try{
    const res=await fetch(API_BASE+'/outie/event/current',{signal:controller.signal,headers:authHeaders()});
    clearTimeout(timer);
    if(!res.ok)return null;
    const data=await res.json();
    if(!data)return null;
    const event=(data.event&&Array.isArray(data.event.spots)&&data.event.spots.length)?data.event:null;
    return {event,devSkipGeo:Boolean(data.devSkipGeo)};
  }catch(error){
    clearTimeout(timer);
    return null;
  }
}

async function checkinApi(spotId,eventKeyArg){
  const eventKey=eventKeyArg||(eventData&&eventData.key)||'';
  const dis=()=>{const b=document.getElementById('redeem-btn');if(b){b.disabled=true;b.textContent='定位中…';}};
  const re=()=>{const b=document.getElementById('redeem-btn');if(b){b.disabled=false;b.textContent='打卡领取';}};
  /* 服务端进度挂在一条隐形记录上：没有就静默建一条（游客昵称），不打断打卡 */
  const rawPost=coords=>apiFetch('/outie/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(coords?{spotKey:spotId,eventKey,...coords,accuracy:geo.accuracy||0}:{spotKey:spotId,eventKey})});
  const doPost=async coords=>{
    try{return await rawPost(coords);}
    catch(error){
      if(String(error&&error.message||'').includes('请先领养宠物')){
        const suffix=(String(identityId()||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(-4))||'0000';
        await adoptApi('旅客'+suffix);
        return rawPost(coords);
      }
      throw error;
    }
  };
  const handle=data=>{
    pet=data.pet;state=stateFromPet(pet);render();
    if(data.alreadyOwned){toast('该点位已打卡。');return;}
    showReward(spotId,0,data.spotVisitors||0,data.visitorNames||[],data.voucher||null);confetti();
    maybeNudgeLogin();
  };
  if(devSkipGeo){
    dis();
    try{handle(await doPost(null));}catch(error){re();failCheckin(error,spotId,eventKey);}
    return;
  }
  if(!navigator.geolocation){toast('此浏览器不支持定位。');return;}
  dis();
  navigator.geolocation.getCurrentPosition(async position=>{
    try{
      geo.accuracy=Math.max(30,Math.round(position.coords.accuracy||0));
      /* 浏览器原始 GPS 是 WGS-84，全 app 统一 GCJ-02（点位/geo.coords 都是），必须转换，否则打卡距离整体偏差 300-600 米 */
      const gcj=wgs84togcj02(position.coords.longitude,position.coords.latitude);
      handle(await doPost({userLng:gcj.lng,userLat:gcj.lat}));
      re();
    }catch(error){re();failCheckin(error,spotId,eventKey);}
  },error=>{re();failCheckin(new Error('获取定位失败：'+(error.message||'请检查定位权限')),spotId,eventKey);},{enableHighAccuracy:true,timeout:9000,maximumAge:15000});
}
/* 打卡失败落点：弹窗内只报一次（不再叠 toast）；距离类报错时，若本场活动由当前身份发布，给出「校准到当前位置」救援入口 */
async function failCheckin(error,spotId,eventKey){
  const msg=errText(error);
  const ce=document.getElementById('checkin-error');
  if(!ce){toast(msg);return;}
  ce.textContent=msg;
  const host=ce.parentElement;
  if(host){const old=host.querySelector('.chk-calib');if(old)old.remove();}
  if(!eventKey||!String(msg).includes('需到点位'))return;
  let mine=false;
  try{const data=await apiFetch('/outie/my-events');mine=Array.isArray(data.events)&&data.events.some(e=>e.key===eventKey);}catch(e){mine=false;}
  if(!mine)return;
  const box=document.createElement('div');
  box.className='chk-calib';
  box.innerHTML='<p class="small-meta">点位位置可能偏了 · 你是本场发起方</p><button type="button" class="btn btn-dark" data-action="chk-calib" data-spot="'+esc(spotId)+'" data-event="'+esc(eventKey)+'">📍 校准点位到当前位置</button>';
  ce.after(box);
}

function qrSVG(){
  const n=13,parts=[];let seed=7;
  const rnd=()=>{seed=(seed*1103515245+12345)>>>0;return seed/4294967296;};
  const finder=(x,y)=>{
    parts.push(`<rect x="${x}" y="${y}" width="5" height="1"/><rect x="${x}" y="${y+4}" width="5" height="1"/><rect x="${x}" y="${y}" width="1" height="5"/><rect x="${x+4}" y="${y}" width="1" height="5"/><rect x="${x+1}" y="${y+1}" width="3" height="3"/>`);
  };
  const inFinder=(x,y)=>(x<6&&y<6)||(x>n-7&&y<6)||(x<6&&y>n-7);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(!inFinder(x,y)&&rnd()<0.44)parts.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);}
  finder(0,0);finder(n-5,0);finder(0,n-5);
  return `<svg class="qr" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">${parts.join('')}</svg>`;
}

let postingPhoto=false,postPresetEvent=null,postNearEvents=null,photoInput=null,eventDetailCache={};
function compressImage(file,maxSide){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
        const w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const g=c.getContext('2d');g.drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg',0.85));
      }catch(e){URL.revokeObjectURL(url);reject(e);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('照片读取失败'));};
    img.src=url;
  });
}
/* dataURL 转 Blob：CSP 的 connect-src 不含 data:，fetch(data:) 在生产会被拦，必须本地解码 */
function dataUrlToBlob(dataUrl){
  const[meta,b64]=String(dataUrl).split(',');
  const mime=(String(meta).match(/^data:([^;]+)/)||[])[1]||'image/jpeg';
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new Blob([bytes],{type:mime});
}

async function publishPhotoPost(){

    if(eventKey&&(!decision.real||(geo.via==='ip'))){

      if(closeBtn)closeBtn.disabled=false;

    form.append('locationSource',decision.real&&geo.via!=='ip'?'gps':'ip');

    nearEvents=null;nearEventsStatus='idle';

function wgs84togcj02(lng,lat){
  if(lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271)return {lng,lat};
  const a=6378245,ee=0.00669342162296594323;
  const tLat=(x,y)=>-100+2*x+3*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x))+(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3+(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3+(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3;
  const tLng=(x,y)=>300+x+2*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x))+(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3+(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3+(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3;
  let dLat=tLat(lng-105,lat-35),dLng=tLng(lng-105,lat-35);
  const radLat=lat/180*Math.PI;let magic=Math.sin(radLat);magic=1-ee*magic*magic;
  const sqrtMagic=Math.sqrt(magic);
  dLat=(dLat*180)/((a*(1-ee))/(magic*sqrtMagic)*Math.PI);
  dLng=(dLng*180)/(a/sqrtMagic*Math.cos(radLat)*Math.PI);
  return {lng:lng+dLng,lat:lat+dLat};
}

/* 定位：与旧官网一致 —— AMap.Geolocation（convert:true 自动 GCJ 转换，SDK 内置精度回退） */
function locateWithAmap(){
  return loadAmap().then(AMap=>new Promise((resolve,reject)=>{
    AMap.plugin('AMap.Geolocation',()=>{
      const geolocation=new AMap.Geolocation({
        enableHighAccuracy:true,
        timeout:10000,
        convert:true,
        showCircle:false,
        showButton:false,
        positionAccuracy:'high'
      });
      geolocation.getCurrentPosition((status,result)=>{
        if(status==='complete'&&result&&result.position){
          const lng=typeof result.position.getLng==='function'?result.position.getLng():result.position.lng;
          const lat=typeof result.position.getLat==='function'?result.position.getLat():result.position.lat;
          if(Number.isFinite(lng)&&Number.isFinite(lat)){
            resolve({lng,lat,accuracy:Number(result.accuracy)||0});
            return;
          }
        }
        reject(new Error('定位失败'));
      });
    });
  })).catch(()=>{
    // AMap 脚本不可用时的最后手段：浏览器定位（两段精度）
    const ask=(high,ms)=>new Promise((resolve,reject)=>{
      if(!navigator.geolocation)return reject(new Error('浏览器不支持定位'));
      navigator.geolocation.getCurrentPosition(
        pos=>{const g=wgs84togcj02(pos.coords.longitude,pos.coords.latitude);resolve({lng:g.lng,lat:g.lat,accuracy:pos.coords.accuracy||0});},
        err=>reject(new Error(err&&err.code===1?'PERMISSION_DENIED':'定位失败')),
        {enableHighAccuracy:high,timeout:ms,maximumAge:30000}
      );
    });
    return ask(true,8000).catch(e=>String(e.message).includes('PERMISSION_DENIED')?Promise.reject(e):ask(false,8000));
  });
}

function spotsWithCoords(){return SPOTS.filter(s=>Number.isFinite(s.lng)&&Number.isFinite(s.lat));}
function fitZoomKm(container,lat,radiusMeters){
  const rect=container.getBoundingClientRect();
  const px=Math.max(200,Math.min(rect.width||340,rect.height||340));
  const mpp=156543.03392*Math.cos((lat||31)*Math.PI/180)/Math.pow(2,16);
  let z=16+Math.log2((mpp*px)/(radiusMeters*2));
  return Math.min(18,Math.max(10,Number.isFinite(z)?z:15));

function haversineMeters(a,b){
  const R=6371000,toRad=d=>d*Math.PI/180;
  const dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function nearestSpot(coords){
  let best=null,bestD=Infinity;
  for(const s of spotsWithCoords()){
    const d=haversineMeters(coords,{lng:s.lng,lat:s.lat});
    if(d<bestD){bestD=d;best=s;}
  }
  return best?{spot:best,distance:bestD}:null;
}

/* ---------- 位置监听：位移超阈值自动刷新附近内容 ---------- */
let geoWatchId=null,locateToastAt=0;
let lastRefreshPos=null;   // 上次触发刷新时的坐标（GCJ-02）
let lastRefreshTime=0;     // 上次触发刷新的时间戳
const REFRESH_MOVE_METERS=100;    // 位移阈值（GPS 抖动通常 ±5-20 米，100 米=真正的位置变化）
const REFRESH_COOLDOWN_MS=30000;  // 最短刷新间隔

function stopGeoWatch(){
  if(geoWatchId!==null&&navigator.geolocation){
    navigator.geolocation.clearWatch(geoWatchId);
    geoWatchId=null;
  }
}

function startGeoWatch(){
  if(mode!=='api'||geoWatchId!==null||!navigator.geolocation)return;
  lastRefreshPos=geo.coords?{...geo.coords}:null;
  lastRefreshTime=Date.now();
  geoWatchId=navigator.geolocation.watchPosition(pos=>{
    const g=wgs84togcj02(pos.coords.longitude,pos.coords.latitude);
    const accuracy=pos.coords.accuracy||0;
    // 忽略精度太差的读数（>500 米可能是 WiFi 三角测量而非 GPS）
    if(accuracy>500)return;
    const newPos={lng:g.lng,lat:g.lat};
    if(!geo.coords){geo.coords=newPos;geo.accuracy=Math.max(accuracy,50);geo.state='ok';geo.via='gps';return;}
    const moved=haversineMeters(geo.coords,newPos);
    // 位移 ≥100 米才刷新（过滤 GPS 抖动）
    if(moved>=REFRESH_MOVE_METERS){
      geo.coords=newPos;
      geo.accuracy=Math.max(accuracy,50);
      const now=Date.now();
      if(now-lastRefreshTime>=REFRESH_COOLDOWN_MS){
        lastRefreshPos={...newPos};
        lastRefreshTime=now;
        updateExploreDynamic();
        loadNearStream(true);
        loadNearEvents(true);
        updateWbLocTexts();
        render();
      }
    }
  },()=>{},{enableHighAccuracy:true,timeout:30000,maximumAge:60000});
}

function fmtClock(iso){

}
function fmtDistance(m){

function eventCenterOf(e){
  if(e.center&&Number.isFinite(e.center.lng))return e.center;
  const pts=(e.spots||[]).filter(sp=>Number.isFinite(sp.lng)&&Number.isFinite(sp.lat));
  if(!pts.length)return null;
  return {lng:pts.reduce((a,p)=>a+p.lng,0)/pts.length,lat:pts.reduce((a,p)=>a+p.lat,0)/pts.length};
}
function citySelectHTML(){
  const nearLabel=(userCity||'附近').replace(/市$/,'');
  const counts={};
  const seen=new Set();
  const tally=e=>{
    if(seen.has(e.key))return;
    seen.add(e.key);
    const c=evtCityCache[e.key];
    if(!c)return;
    const on=e.active!==false;
    const rec=counts[c]||(counts[c]={on:0,all:0});
    rec.all++;if(on)rec.on++;
  };
  (nearEvents||[]).forEach(tally);
  (myEvents||[]).forEach(tally);
  const cities=Object.entries(counts).sort((a,b)=>(b[1].on-a[1].on)||(b[1].all-a[1].all)||a[0].localeCompare(b[0]));
  const opts=[['near',nearLabel]].concat(cities.map(([c])=>[c,c]));
  return `<select id="dv-city-select" class="dv-city-select" aria-label="切换城市">${opts.map(([k,label])=>`<option value="${esc(k)}"${atlasCitySel===k?' selected':''}>${esc(label)}${k!=='near'&&counts[k]&&counts[k].on?' · '+counts[k].on:''}</option>`).join('')}</select>`;
}

}

/* CITY ATLAS：AMap JS 渲染（位置由 SDK 保证）+ zine 处理层（滤镜只作用于瓦片画布） */
let atlasMap=null,atlasAmapMarkers=[],atlasSel=0,atlasEvKeys=[],atlasMapPending=false;
let atlasCitySel='near',evtCityCache={},evtCityFetch={},userCity='',atlasInfoHidden=true,discoverEnterLoaded=false;
function ensureEventCities(){
  const pool={};
  (nearEvents||[]).forEach(e=>{if(e.center&&Number.isFinite(e.center.lng))pool[e.key]=e;});
  (myEvents||[]).forEach(e=>{const c=eventCenterOf(e);if(c)pool[e.key]={key:e.key,center:c,active:e.active};});
  const evs=Object.values(pool).filter(e=>!evtCityCache[e.key]&&!evtCityFetch[e.key]);
  if(!evs.length)return Promise.resolve();
  return Promise.all(evs.slice(0,10).map(ev=>{
    evtCityFetch[ev.key]=true;
    return apiFetch(`/location/regeo?lng=${ev.center.lng}&lat=${ev.center.lat}`).then(d=>{
      const a=d&&d.address||{};
      evtCityCache[ev.key]=String(a.city||a.province||'').trim()||'其他城市';
    }).catch(()=>{evtCityCache[ev.key]='其他城市';});
  })).then(()=>refreshCitySelect());
}
function ensureUserCity(){
  if(userCity)return Promise.resolve(userCity);
  return apiFetch('/location/ip').then(d=>{
    const a=d&&d.address||{},loc=d&&d.location||{};
    userCity=String(a.city||a.province||loc.city||loc.province||'').trim();
    return userCity;
  }).catch(()=>{userCity='';return '';});
}
function atlasAllEvents(){
  /* near + my 合并去重（同 key 以 near 优先），myEvents 补充已下架场次 */
  const pool={};
  (nearEvents||[]).forEach(e=>{if(e.center&&Number.isFinite(e.center.lng))pool[e.key]=e;});
  (myEvents||[]).forEach(e=>{
    if(pool[e.key])return;
    const c=eventCenterOf(e);
    if(c)pool[e.key]={key:e.key,name:e.name,subtitle:e.subtitle,active:e.active,center:c,spots:e.spots||[],coverUrl:e.coverUrl||''};
  });
  return Object.values(pool);
}
function atlasCityEvents(){
  const all=atlasAllEvents();
  if(atlasCitySel==='near'){
    const withD=all.filter(e=>e.active!==false).map(e=>({e,d:eventDist(e)})).filter(x=>x.d!=null);
    const inCity=withD.filter(x=>x.d<=50000).sort((a,b)=>a.d-b.d);
    /* 当前城市（50km）有活动就只画城市；没有就画全国最近 5 场，别让藏宝图空着 */
    if(inCity.length)return inCity.map(x=>x.e);
    return withD.sort((a,b)=>a.d-b.d).slice(0,5).map(x=>x.e);
  }
  /* 指定城市：进行中在前，已下架的排后（灰显） */
  const inCity=all.filter(e=>evtCityCache[e.key]===atlasCitySel);
  return inCity.sort((a,b)=>((b.active!==false)-(a.active!==false))||((eventDist(a)||1e12)-(eventDist(b)||1e12)));
}
function atlasSkeletonHTML(){
  return `<div class="atl"><div class="atl-frame"><div id="dv-atlas-map" class="atl-map"></div><span class="atl-dots" aria-hidden="true"></span><span class="atl-compass" aria-hidden="true">↑N</span><span class="atl-stamp mono" aria-hidden="true">OUTIE<br>SURVEY</span><span class="atl-title mono" aria-hidden="true">CITY ATLAS</span><div class="atl-info-wrap" id="dv-atlas-info">${atlasInfoHTML()}</div></div></div>`;
}
function destroyAtlasMap(){
  if(atlasMap){try{atlasMap.destroy();}catch(e){}}
  atlasMap=null;atlasAmapMarkers=[];atlasEvKeys=[];
}
function atlasPinContent(ev,d,sel){

  return `<button type="button" class="atl-pin${sel?' sel':''}${off?' off':''}" data-action="atlas-pin"><span class="atl-x${off?' off':''}">✕</span><span class="atl-name">${esc(String(ev.name).slice(0,8))}${d!=null?' · '+fmtDistance(d):''}${off?' · 已结束':''}</span></button>`;
}
function atlasRefreshSel(){
  const wrap=document.getElementById('dv-atlas-info');
  if(wrap)wrap.innerHTML=localize(atlasInfoHTML());
  document.querySelectorAll('#dv-atlas-map .atl-pin').forEach((el,i)=>el.classList.toggle('sel',i===atlasSel));
  /* 宝藏虚线：你 → 选中活动 */
  if(atlasMap&&atlasAmapMarkers._route){
    const evs=atlasCityEvents();const ev=evs[atlasSel];
    if(ev&&geo.state==='ok'&&geo.coords&&ev.center){
      atlasAmapMarkers._route.setPath([[geo.coords.lng,geo.coords.lat],[ev.center.lng,ev.center.lat]]);
      atlasAmapMarkers._route.show();
    }else if(atlasAmapMarkers._route)atlasAmapMarkers._route.hide();
  }
}
function buildAtlasOverlay(){
  const AMap=window.AMap,evs=atlasCityEvents();
  if(!atlasMap||!AMap)return;
  /* 覆盖物重建：先清旧的（保留路线引用一并清）——空城市也必须清，否则切城市看着像没切 */
  const old=[...atlasAmapMarkers].filter(Boolean);
  if(old.length)atlasMap.remove(old);
  if(atlasAmapMarkers._route){try{atlasMap.remove(atlasAmapMarkers._route);}catch(e){}}
  const holderCur=document.getElementById('dv-atlas-map');
  const oldEmpty=holderCur&&holderCur.querySelector('.atl-empty');
  if(oldEmpty)oldEmpty.remove();
  if(!evs.length){
    if(holderCur&&holderCur.isConnected){
      const tip=document.createElement('div');
      tip.className='atl-empty';
      tip.innerHTML=`<span>${esc(atlasCitySel)}暂无进行中的活动</span>`;
      holderCur.appendChild(tip);
    }
    atlasAmapMarkers=[];
    return;
  }
  atlasAmapMarkers=evs.map((ev,i)=>{
    const mk=new AMap.Marker({
      position:[ev.center.lng,ev.center.lat],
      anchor:'bottom-center',
      content:atlasPinContent(ev,eventDist(ev),i===atlasSel),
      zIndex:12
    });
    mk.on('click',()=>{atlasSel=i;atlasInfoHidden=false;atlasRefreshSel();});
    return mk;
  });
  atlasMap.add(atlasAmapMarkers);
  if(atlasAmapMarkers._route){atlasMap.remove(atlasAmapMarkers._route);atlasAmapMarkers._route=null;}
  if(geo.state==='ok'&&geo.coords){
    const me=new AMap.Marker({position:[geo.coords.lng,geo.coords.lat],content:'<span class="atl-me">◈</span>',anchor:'center',zIndex:11});
    atlasMap.add(me);
    const route=new AMap.Polyline({path:[[geo.coords.lng,geo.coords.lat],[evs[atlasSel].center.lng,evs[atlasSel].center.lat]],strokeColor:'#FF87C3',strokeWeight:3,strokeStyle:'dashed',showDir:false,zIndex:9});
    atlasMap.add(route);
    atlasAmapMarkers._route=route;
  }
  const keysChanged=atlasEvKeys.join()!==evs.map(e=>e.key).join();
  if(keysChanged){
    try{atlasMap.setFitView(atlasAmapMarkers.slice(),false,[36,36,36,40],15);}catch(e){}
    /* 只有活动集合变化（入页刷新/切城市）才收起卡片；同集合的数据刷新不打断用户 */
    atlasInfoHidden=true;
    if(atlasSel>=evs.length)atlasSel=0;
  }
  atlasEvKeys=evs.map(e=>e.key);
  atlasRefreshSel();
}
function initAtlasMap(){
  if(view!=='discover')return;
  const holder=document.getElementById('dv-atlas-map');
  if(!holder)return;
  /* render() 会整体重写 main.innerHTML：实例绑在被丢弃容器上时必须销毁重建 */
  if(atlasMap){
    const cont=(typeof atlasMap.getContainer==='function')?atlasMap.getContainer():null;
    if(cont===holder&&cont.isConnected)return;
    destroyAtlasMap();
  }
  if(atlasMapPending)return;
  const evs=atlasCityEvents();
  if(!evs.length){const f=document.getElementById('dv-atlas');if(f)f.innerHTML=treasureMapInner();return;}
  atlasMapPending=true;
  loadAmap().then(AMap=>{
    atlasMapPending=false;
    if(view!=='discover')return;
    const h2=document.getElementById('dv-atlas-map');
    if(!h2)return;
    if(atlasMap){
      const cont=(typeof atlasMap.getContainer==='function')?atlasMap.getContainer():null;
      if(cont===h2&&cont.isConnected)return;
      destroyAtlasMap();
    }
    atlasMap=new AMap.Map(h2,{center:[evs[0].center.lng,evs[0].center.lat],zoom:12,viewMode:'2D',zooms:[9,18],mapStyle:'amap://styles/whitesmoke',showIndoorMap:false,isHotspot:false});
    buildAtlasOverlay();
  }).catch(()=>{atlasMapPending=false;const f=document.getElementById('dv-atlas');if(f&&document.getElementById('dv-atlas-map'))f.innerHTML=treasureMapInner();});
}

function treasureMapInner(){
  if(nearEventsStatus==='loading'||nearEventsStatus==='idle')return '<div class="tmap"><div class="tmap-grid"></div><p class="about-list mono" style="position:absolute;inset:0;display:grid;place-items:center;margin:0">藏宝图测绘中…</p></div>';
  if(nearEventsStatus==='error'||!(nearEvents||[]).length)return '<button type="button" class="tmap" data-action="nav" data-view="explore" style="width:100%"><div class="tmap-grid"></div><p class="about-list mono" style="position:absolute;inset:0;display:grid;place-items:center;margin:0">还没有已知活动 · 去地图看看</p></button>';
  const evs=nearEvents.slice(0,6);
  const lats=evs.map(e=>e.center&&e.center.lat).filter(Number.isFinite);
  const lngs=evs.map(e=>e.center&&e.center.lng).filter(Number.isFinite);
  const pin=(e,i)=>{
    const c=e.center;
    if(!c||!Number.isFinite(c.lat)||!Number.isFinite(c.lng))return '';
    const x=lats.length>1?12+((c.lng-Math.min(...lngs))/(Math.max(...lngs)-Math.min(...lngs)))*76:50;
    const y=lngs.length>1?14+((Math.max(...lats)-c.lat)/(Math.max(...lats)-Math.min(...lats)))*72:50;
    return `<span class="tmap-pin c${i%3}" style="left:${x}%;top:${y}%" title="${esc(e.name)}"></span>`;
  };
  const nearest=evs.find(e=>Number.isFinite(e.distanceMeters))||evs[0];
  const nc=nearest&&nearest.center;
  const tag=nc&&Number.isFinite(nc.lat)?`<span class="tmap-tag" style="left:${lngs.length>1?12+((nc.lng-Math.min(...lngs))/(Math.max(...lngs)-Math.min(...lngs)))*76:50}%;top:${lngs.length>1?14+((Math.max(...lats)-nc.lat)/(Math.max(...lats)-Math.min(...lats)))*72:50}%">${esc(nearest.name)} · LIVE</span>`:'';
  return `<button type="button" class="tmap" style="width:100%" data-action="nav" data-view="explore" aria-label="打开地图"><div class="tmap-grid"></div>${evs.map(pin).join('')}${tag}</button>`;
}

/* ---------- 附近活动 ---------- */
let nearEventsScope='near';
async function loadNearEvents(force){
  if(mode!=='api')return;
  if(nearEventsStatus==='loading')return;
  if(nearEvents&&!force&&!(geo.state==='ok'&&geo.coords&&nearEventsScope==='all'))return;
  if(geo.state!=='ok'||!geo.coords){
    /* 定位不可用≠没活动：直接给全部进行中的活动，别让人空手 */
    nearEventsScope='all';
    nearEventsStatus='loading';
    refreshNearSurfaces();
    try{
      const data=await apiFetch('/outie/events/all');
      nearEvents=Array.isArray(data&&data.events)?data.events:[];
      nearEventsStatus='ready';
    }catch(error){nearEventsStatus='error';}
    refreshNearSurfaces();
    return;
  }
  nearEventsScope='near';
  nearEventsStatus='loading';
  refreshNearSurfaces();
  try{
    const data=await apiFetch(`/outie/events/nearby?lat=${geo.coords.lat}&lng=${geo.coords.lng}&radius=5000000`);
    nearEvents=Array.isArray(data&&data.events)?data.events:[];
    nearEventsStatus='ready';
  }catch(error){nearEventsStatus='error';}
  refreshNearSurfaces();
  renderMapMarkers();
}
function eventsBody(){
  if(nearEventsStatus==='loading'||nearEventsStatus==='idle')return `<div class="live-cell-empty" style="max-width:none"><span class="live-dither" aria-hidden="true"></span><p>加载中…</p></div>`;
  if(nearEventsStatus==='error')return `<div class="live-cell-empty" style="max-width:none"><span class="live-dither" aria-hidden="true"></span><p>活动加载失败。</p><button class="live-status-btn" type="button" data-action="near-refresh">重试</button></div>`;
  /* 附近现场=字面意义：只显示定位 10km 内的进行中活动（全城/全国的在活动大厅） */
  const near=(nearEvents||[]).map(e=>({e,d:eventDist(e)})).filter(x=>x.e.active!==false&&x.d!=null&&x.d<=10000).sort((a,b)=>a.d-b.d);
  if(!near.length)return `<div class="live-cell-empty" style="max-width:none"><span class="live-dither" aria-hidden="true"></span><p>附近暂无进行中的活动。全部活动见「首页」。</p></div>`;
  return `<div class="event-cards">${near.map(x=>eventCard(x.e)).join('')}</div>`;
}
function eventCard(e){
  const cover=e.coverUrl?`<img class="event-cover" src="${esc(photoAbsUrl(e.coverUrl))}" alt="" loading="lazy">`:`<span class="event-cover event-cover-empty mono" aria-hidden="true">${pixText('EVENT',2,'#26241c')}</span>`;
  /* GO/LOCK 以距离为门槛：进入活动范围（500m）才亮绿，否则灰色锁定 */
  let distM=Number.isFinite(e.distanceMeters)?e.distanceMeters:null;
  if(distM==null&&eventData&&e.key===eventData.key&&geo.state==='ok'&&geo.coords&&SPOTS.length){
    const ds=SPOTS.filter(sp=>Number.isFinite(sp.lng)).map(sp=>haversineMeters(geo.coords,{lng:sp.lng,lat:sp.lat}));
    if(ds.length)distM=Math.round(Math.min(...ds));
  }
  const inRange=geo.state==='ok'&&distM!=null&&distM<=500;
  const isCur=eventData&&e.key===eventData.key;
  const goBtn=e.active===false
    ?'<button type="button" class="btn-mini btn-lock" disabled>LOCK</button>'
    :(!inRange
      ?`<button type="button" class="btn-mini btn-lock" disabled title="到活动范围附近解锁">${geo.state==='ok'&&distM!=null?fmtDistance(distM):'未定位'}</button>`
      :(isCur
        ?'<button type="button" class="btn-mini btn-go" data-action="nav" data-view="event">GO</button>'
        :`<button type="button" class="btn-mini btn-go" data-action="event-open" data-event="${esc(e.key)}">GO</button>`));
  return `<article class="panel event-card"><div class="event-cover-wrap">${cover}</div><div class="event-card-body"><h3>${esc(e.name)}</h3><p class="event-card-sub">${esc(e.subtitle||'')} · ${(e.spots&&e.spots.length)||e.spotCount||0} 个点位${distM!=null?' · '+fmtDistance(distM):''}</p>${goBtn}</div></article>`;
}
