function eventNameFor(key){
  if(!key)return '';
  if(eventData&&eventData.key===key)return eventData.name;
  const cache=eventDetailCache&&eventDetailCache[key];if(cache&&cache.name)return cache.name;
  const past=(pastCollection||[]).find(c=>c.eventKey===key);if(past&&past.eventName)return past.eventName;
  const ev=(nearEvents||[]).find(x=>x.key===key);if(ev)return ev.name;
  const mine=(myEvents||[]).find(x=>x.key===key);if(mine)return mine.name;
  return String(key).toUpperCase();
}
function albumBody(){
  if(mode!=='api')return `<div class="empty-state">OFFLINE</div>`;
  if(mineStatus==='loading')return `<p class="small-meta mono" style="padding:20px 0">加载中…</p>`;
  if(mineStatus==='error')return `<div class="empty-state">加载失败<br><button type="button" class="live-status-btn" data-action="mine-refresh">重试</button></div>`;
  if(!minePhotos||!minePhotos.length)return `<div class="empty-state">EMPTY ARCHIVE</div>`;
  const photos=albumFilter==='all'?minePhotos:minePhotos.filter(p=>p.eventKey===albumFilter);
  if(!photos.length)return `<div class="empty-state">NO PHOTOS HERE</div>`;
  /* 按活动分组（无活动归属的归到 LATEST） */
  const groups={};
  for(const p of photos){
    const d=new Date(p.createdAt);
    const date=isNaN(d.getTime())?'----':`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    const key=p.eventKey||'LATEST';
    const g=(groups[key]=groups[key]||{name:p.eventKey?eventNameFor(p.eventKey):'LATEST',firstDate:date,list:[]});
    g.list.push(p);
    if(date<g.firstDate)g.firstDate=date;
  }
  return Object.entries(groups).map(([k,g])=>`<section class="archive-section"><div class="section-header"><span class="section-title">${esc(g.name)}</span><span class="section-date mono">${g.firstDate}</span></div><div class="photo-grid">${g.list.map(mineCell).join('')}</div></section>`).join('')+'';
}

function albumNameForEvent(eventKey){
  for(const list of [myEvents,nearEvents]){
    if(!Array.isArray(list))continue;
    const hit=list.find(e=>e.key===eventKey);
    if(hit)return hit.name;
  }
  return '活动相册';
}
function groupMinePhotos(photos){
  const albums=[];
  for(const p of (Array.isArray(photos)?photos:[])){
    if(p.eventKey){
      let a=albums.find(x=>x.key==='evt:'+p.eventKey);
      if(!a){a={key:'evt:'+p.eventKey,name:albumNameForEvent(p.eventKey),cover:p,items:[]};albums.push(a);}
      a.items.push(p);
      continue;
    }
    if(!Number.isFinite(p.lat)||!Number.isFinite(p.lng)){
      let g=albums.find(x=>x.key==='other');
      if(!g){g={key:'other',name:'其他',cover:p,items:[]};albums.push(g);}
      g.items.push(p);
      continue;
    }
    let a=null;
    for(const x of albums){
      if(x.key.startsWith('geo:')&&haversineMeters({lat:x.lat,lng:x.lng},{lat:p.lat,lng:p.lng})<=45){a=x;break;}
    }
    if(!a){a={key:'geo:'+albums.length,lat:p.lat,lng:p.lng,name:(String(p.caption||'').trim()||'现场').slice(0,12),cover:p,items:[]};albums.push(a);}
    a.items.push(p);
  }
  return albums;
}

function wbError(msg){toast(msg);const el=document.getElementById('wb-error');if(el)el.textContent=msg;}
async function submitWorkbench(){
  if(wbBusy)return;
  const name=document.getElementById('wb-name').value.trim();
  if(!name){wbError('填写活动名称。');return;}
  const subtitle=document.getElementById('wb-subtitle').value.trim();
  const active=document.getElementById('wb-active').checked;
  const voucherEnabled=Boolean(document.getElementById('wb-voucher')&&document.getElementById('wb-voucher').checked);
  /* 坐标解析：锁定的用锁定值；未锁定的用当前定位；拿不到真实定位就明确拒绝，绝不造假坐标 */
  const located=geo.state==='ok'&&geo.coords;
  const spotsPayload=[];
  for(let i=0;i<ensureWbSpots().length;i++){
    const sp=wbSpots[i];
    const lng=sp.setAt?sp.lng:(located?Number(geo.coords.lng.toFixed(6)):null);
    const lat=sp.setAt?sp.lat:(located?Number(geo.coords.lat.toFixed(6)):null);
    const badVia=sp.setAt&&sp.via==='ip';
    if(!Number.isFinite(lng)||!Number.isFinite(lat)||badVia){
      wbBusy=false;
      wbError('点位 '+(i+1)+(badVia?' 的坐标来自 IP 城市级定位，参与者将无法打卡，请到场地重新锁定':' 未定位：点该行的「用我的位置」锁定坐标'));
      return;
    }
    spotsPayload.push({
      name:sp.name,zone:sp.zone,arrivalNote:sp.arrivalNote,
      lng,lat
    });
  }
  const payload={name,subtitle,active,voucherEnabled,spots:spotsPayload};
  wbBusy=true;
  const pubBtn=document.querySelector('#wb-form button[type="submit"]');
  if(pubBtn){pubBtn.disabled=true;pubBtn.textContent='发布中…';}
  try{
    await apiFetch('/outie/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    wbBusy=false;wbSpots=null;myEvents=null;myEventsStatus='idle';
    /* 新活动立即出现在各页：刷新当前活动上下文与各页缓存 */
    await refreshEventContext();
    toast('活动已发布'+(active?'并上架。':'（未上架）。')+'回到账本。');
    wbView='dash';
    render();
    const wrap=document.getElementById('wb-my-events');
    if(wrap)loadMyEventsList(true);
  }catch(error){wbBusy=false;const pubBtn2=document.querySelector('#wb-form button[type="submit"]');if(pubBtn2){pubBtn2.disabled=false;pubBtn2.textContent='发布活动';}wbError('发布失败：'+errText(error));}
}
async function refreshAuthState(){
  authUser=null;
  if(authToken()){
    try{
      const data=await apiFetch('/auth/verify');
      authUser=data.user||null;
    }catch(error){
      if(error.status===401||(error.status===404&&/user not found/i.test(String(error.message||'')))){
        try{localStorage.removeItem('outie.auth-token');}catch(e){}
      }
    }
  }
  try{
    const me=await apiFetch('/outie/me');
    pet=me&&me.pet?me.pet:null;
    pastCollection=me&&Array.isArray(me.collection)?me.collection:[];
  }catch(e){pet=null;pastCollection=[];}
  state=pet?stateFromPet(pet):blankState();
}

  const rows=[];

    const ts=Object.values(state.rewards||{}).map(v=>new Date(v).getTime()).filter(Number.isFinite);

}

/* 像素音效：方波短音，「我的」页可关 */
let audioCtx=null;
function blip(kind){
  try{
    if(localStorage.getItem('outie.mute')==='1'||reduceMotion.matches)return;
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const seq={feed:[[660,.07],[880,.11]],checkin:[[523,.07],[659,.07],[784,.13]],evolve:[[523,.07],[659,.07],[784,.07],[1046,.18]],pet:[[660,.04]],wear:[[880,.06]]}[kind];
    if(!seq)return;
    let t=audioCtx.currentTime+.01;
    for(const[f,d]of seq){
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='square';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.045,t+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(audioCtx.destination);
      o.start(t);o.stop(t+d+.02);
      t+=d;
    }
  }catch(e){}
}

function captureAuthFromUrl(){

    const url=new URL(location.href);
    const token=url.searchParams.get('token');
    const error=url.searchParams.get('error');
    if(!token&&error===null)return;
    if(token)localStorage.setItem('outie.auth-token',token);
    url.searchParams.delete('token');url.searchParams.delete('error');
    history.replaceState(null,'',url.pathname+(url.searchParams.toString()?'?'+url.searchParams:'')+url.hash);
    if(token)toast('GitHub 登录成功。');
    if(error)toast('登录没有完成，请重试。');
  }catch(e){}
}
async function boot(){
  captureAuthFromUrl();
  const probe=await probeApi();
  if(probe){
    mode='api';
    devSkipGeo=Boolean(probe.devSkipGeo);
    if(probe.event){applyEvent(probe.event);}
    else{eventData=null;SPOTS=[];}
    await refreshAuthState();
  }else{
    mode='offline';
    SPOTS=OFFLINE_SPOTS;
    state=loadState();
    document.getElementById('offline-badge').hidden=false;
    scheduleReconnect();
  }
  document.getElementById('dev-badge').hidden=!devSkipGeo;
  document.getElementById('offline-badge').hidden=(mode!=='offline');
  document.getElementById('storage-warning').hidden=storageOK;
  render();
}
let unreadComments=0,lastCommentSeen=0;
try{lastCommentSeen=Number(localStorage.getItem('outie.cmt-seen'))||0;}catch(e){}
async function pollCommentActivity(){
  if(mode!=='api'||!authHeaders().Authorization&&!localStorage.getItem('outie.identity.v1'))return;
  try{
    const d=await apiFetch('/outie/comments/activity?since='+encodeURIComponent(lastCommentSeen||0));
    unreadComments=d.unread||0;
    applyTitle();
    /* 通知横幅：可点直达那张照片 */
    let banner=document.getElementById('cmt-banner');
    if(unreadComments>0&&d.latest&&d.latest.photoId){
      if(!banner){
        banner=document.createElement('button');
        banner.id='cmt-banner';banner.type='button';
        banner.style.cssText='position:fixed;left:12px;right:12px;bottom:74px;z-index:60;background:#26241c;color:#efecdf;border:2px solid #26241c;padding:10px 14px;font:700 12px/1.5 ui-monospace,monospace;text-align:left';
        banner.addEventListener('click',()=>{markCommentsSeen();closeModal();openPhotoDetail(banner.dataset.photo);banner.remove();});
        document.body.appendChild(banner);
      }
      banner.dataset.photo=d.latest.photoId;
      banner.textContent=`💬 照片有新评论：「${(d.latest.text||'').slice(0,24)}」 · 点击查看`;
      applyTitle();
    } else if(banner) banner.remove();
    const navBtn=document.getElementById('mobile-nav')?.querySelector('[data-view="mine"],[data-view="explore"]');
    document.querySelectorAll('[data-view="mine"]').forEach(b=>{
      let dot=b.querySelector('.cmt-dot');
      if(unreadComments>0){if(!dot){dot=document.createElement('i');dot.className='cmt-dot';b.style.position='relative';b.appendChild(dot);}}
      else if(dot)dot.remove();
    });
  }catch(e){}
}
function applyTitle(){
  const unread=unreadComments>0?`(${unreadComments}) `:'';
  document.title=localize(`${unread}OUTIE — 到现场打卡，集章收集`);
}
function markCommentsSeen(){
  try{lastCommentSeen=Date.now();unreadComments=0;localStorage.setItem('outie.cmt-seen',String(lastCommentSeen));document.querySelectorAll('.cmt-dot').forEach(d=>d.remove());const b=document.getElementById('cmt-banner');if(b)b.remove();applyTitle();}catch(e){}
}
let reconnectTimer=null;
function scheduleReconnect(){
  if(reconnectTimer||mode!=='offline')return;
  reconnectTimer=setInterval(async()=>{
    if(await probeApi()){clearInterval(reconnectTimer);reconnectTimer=null;boot();}
  },15000);
}
async function tryReconnect(){
  if(mode!=='offline')return;
  if(await probeApi()){if(reconnectTimer){clearInterval(reconnectTimer);reconnectTimer=null;}boot();}
  else toast('连接失败。稍后重试');
}
const __wm=document.getElementById('wordmark');if(__wm)__wm.innerHTML=pixText('OUTIE',4);
setInterval(pollCommentActivity,45000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollCommentActivity();});
window.addEventListener('focus',()=>pollCommentActivity());
/* iOS 加到主屏的一次性引导：装成图标才有回访入口 */
(function(){
  try{
    const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
    if(!ios||navigator.standalone)return;
    if(localStorage.getItem('outie.a2hs'))return;
    localStorage.setItem('outie.a2hs','1');
    setTimeout(()=>toast('用 Safari 的「分享 → 添加到主屏幕」，下次从图标直接进 OUTIE。'),2500);
  }catch(e){}
})();
boot();
