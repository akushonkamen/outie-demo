.footer{color:#6b6380}.footer .mono{color:var(--purple)}

<script>
'use strict';
/* Single-file, local-only prototype. No network requests, tracking, GPS, or hardware APIs. */
const STORAGE_KEY = 'outie.singleplayer.v1';
const SPOTS = [
  {id:'music',number:'01',name:'霓虹舞台',zone:'音乐区',en:'PLAY IT<br>LOUD.',reward:'夜游耳机',short:'耳机',tag:'MUSIC LOVER',line:'一起听过现场，就算认识了。',icon:'headphones'},
  {id:'art',number:'02',name:'像素画廊',zone:'展览区',en:'LOOK<br>CLOSER.',reward:'数码眼镜',short:'眼镜',tag:'ART EXPLORER',line:'换个滤镜，看点不一样的。',icon:'glasses'},
  {id:'market',number:'03',name:'怪趣市集',zone:'市集区',en:'FIND YOUR<br>WEIRD.',reward:'星星背包',short:'背包',tag:'CURIOUS SOUL',line:'喜欢的小东西，通通带回家。',icon:'bag'}
];
const LOOKS = [
  {id:'base',name:'原生形态',short:'初始',label:'JUST ME',speech:'带我去逛逛？',tag:'READY TO GO'},
  ...SPOTS.map(s=>({id:s.id,name:s.reward,short:s.short,label:s.tag,speech:s.id==='music'?'刚刚那首，好好听。':s.id==='art'?'今天看到新东西了。':'捡到一点小快乐！',tag:s.tag})),
  {id:'evolved',name:'出逃星人',short:'限定',label:'AFTER HOURS',speech:'今天的我，有点不一样。',tag:'OUTSIDE CLUB'}
];
let svgId=0, storageOK=true, toastTimer=null, flashNext=false;
let state=loadState();
let view=location.hash.includes('explore')?'explore':'pet';
let currentModal=null, lastFocused=null;
const main=document.getElementById('main');
const dialog=document.getElementById('dialog');
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
function blankState(){return {version:1,name:'',createdAt:null,rewards:{},equipped:'base',evolved:false};}
function loadState(){
  try{
    const testKey=STORAGE_KEY+'.probe';localStorage.setItem(testKey,'1');localStorage.removeItem(testKey);
    const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return blankState();
    const data=JSON.parse(raw);if(!data||data.version!==1||typeof data.name!=='string')return blankState();
    const clean=blankState();clean.name=trimName(data.name);clean.createdAt=typeof data.createdAt==='string'?data.createdAt:null;
    if(!clean.name)return clean;
    for(const spot of SPOTS){if(data.rewards&&typeof data.rewards[spot.id]==='string')clean.rewards[spot.id]=data.rewards[spot.id];}
    clean.evolved=Object.keys(clean.rewards).length===3&&data.evolved===true;
    const allowed=['base',...Object.keys(clean.rewards),...(clean.evolved?['evolved']:[])];
    clean.equipped=allowed.includes(data.equipped)?data.equipped:'base';return clean;
  }catch(error){
    // A corrupt save is recoverable; inaccessible storage falls back to in-memory play.
    try{const k=STORAGE_KEY+'.probe';localStorage.setItem(k,'1');localStorage.removeItem(k);}catch(e){storageOK=false;}
    return blankState();
  }
}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){storageOK=false;document.getElementById('storage-warning').hidden=false;}}
function trimName(value){return [...String(value).trim()].slice(0,12).join('');}
function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function count(){return SPOTS.filter(s=>Boolean(state.rewards[s.id])).length;}
function unlocked(id){return id==='base'||(id==='evolved'?state.evolved:Boolean(state.rewards[id]));}
function lookFor(id){return LOOKS.find(l=>l.id===id)||LOOKS[0];}
function icon(name,cls=''){
  const paths={
    pet:'<path d="M7 9V5a2 2 0 0 1 4 0v2h2V5a2 2 0 0 1 4 0v4a7 7 0 1 1-10 0Z"/><path d="M9 13v1m6-1v1m-5 3c1 1 3 1 4 0"/>',
    compass:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/>',
    arrow:'<path d="M4 12h15m-6-6 6 6-6 6"/>',
    back:'<path d="M20 12H5m6-6-6 6 6 6"/>',
    settings:'<path d="M4 7h7m5 0h4M4 17h3m5 0h8"/><circle cx="13.5" cy="7" r="2.5"/><circle cx="9.5" cy="17" r="2.5"/>',
    close:'<path d="m6 6 12 12M18 6 6 18"/>',
    lock:'<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V6a4 4 0 0 1 8 0v4m-4 5v2"/>',
    check:'<path d="m5 12 4 4L19 6"/>',
    headphones:'<path d="M4 14v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="11" width="4" height="9" rx="2"/><rect x="17" y="11" width="4" height="9" rx="2"/>',
    glasses:'<rect x="2" y="9" width="8" height="7" rx="2"/><rect x="14" y="9" width="8" height="7" rx="2"/><path d="M10 12h4M2 10l2-4m18 4-2-4"/>',
    bag:'<rect x="5" y="6" width="14" height="16" rx="4"/><path d="M9 6V4a3 3 0 0 1 6 0v2m-7 9h8"/><path d="m12 9 .8 1.8 2 .2-1.5 1.3.5 2-1.8-1-1.8 1 .5-2L9.2 11l2-.2Z"/>',
    star:'<path d="m12 2 2.7 6.3 6.8.7-5.1 4.5 1.5 6.7-5.9-3.5-5.9 3.5 1.5-6.7L2.5 9l6.8-.7Z"/>',
    sparkle:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/>',
    pin:'<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2"/>',
    info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.2"/>',
    qr:'<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 8h2v2H8zm6 0h2v2h-2zm-6 6h2v2H8zm6 0h2v2h-2z"/>',
    reset:'<path d="M3 10a9 9 0 1 1 1 7M3 4v6h6"/>',
    heart:'<path d="M20.5 5.8a5 5 0 0 0-7.1 0L12 7.2l-1.4-1.4a5 5 0 0 0-7.1 7.1L12 21l8.5-8.1a5 5 0 0 0 0-7.1Z"/>',
    save:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 3v6h10V3M7 21v-7h10v7m-3-17v3"/>',
    external:'<path d="M14 3h7v7m0-7L10 14M10 3H6a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3v-4"/>'
  };
  return `<svg class="icon ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.star}</svg>`;
}
function starSVG(cls=''){return `<svg class="${cls}" viewBox="0 0 40 40" fill="currentColor" aria-hidden="true"><path d="M20 0 25 14 40 20 25 25 20 40 14 25 0 20 14 14Z"/></svg>`;}
function petSVG(variant='base',extra=''){
  const id='p'+(++svgId), evo=variant==='evolved';
  const colors={base:['#e4ff9a','#bcd96e'],music:['#ddc9ff','#a889e1'],art:['#cdf7b2','#9dcb8c'],market:['#fff2a0','#ddc376'],evolved:['#bea1fa','#7151b9']};
  const [light,dark]=colors[variant]||colors.base;
  const body='M77 99 C68 80 62 60 66 48 C70 37 82 39 92 53 L116 84 Q139 76 156 86 L177 53 C187 38 200 37 205 48 C211 61 200 85 195 101 C213 116 222 139 217 162 C213 192 193 208 169 211 Q148 216 120 211 C92 214 71 201 60 182 C43 154 54 117 77 99Z';
  const behind=evo?`<path d="M67 133 21 99l6 35-13 5 37 29 18-8m132-28 43-33-5 35 13 5-37 29-18-8" fill="url(#${id}chrome)" stroke="#332745" stroke-width="3.5" stroke-linejoin="round"/><path d="m30 116 26 30m171-30-24 30" stroke="#a28bcd" stroke-width="3"/>`:variant==='market'?'<path d="m188 114 19-27 13 28 28 9-25 20 2 28-27-15-24 12 5-28-17-21Z" fill="#a582eb" stroke="#34372c" stroke-width="3.5" stroke-linejoin="round"/>':'';
  const face=evo?`<rect x="99" y="132" width="15" height="21" rx="5" fill="#252b3d"/><rect x="158" y="132" width="15" height="21" rx="5" fill="#252b3d"/><rect x="102" y="132" width="9" height="12" rx="3" fill="#beffe1"/><rect x="161" y="132" width="9" height="12" rx="3" fill="#beffe1"/>`:`<rect x="98" y="131" width="14" height="21" rx="5" fill="#30342d"/><rect x="158" y="131" width="14" height="21" rx="5" fill="#30342d"/><rect x="100" y="132" width="5" height="6" rx="2" fill="#fffef0"/><rect x="160" y="132" width="5" height="6" rx="2" fill="#fffef0"/>`;
  const accessories=variant==='music'?`<path d="M63 137c-9-44 14-75 69-77 53-2 83 29 78 76" fill="none" stroke="#35332f" stroke-width="16" stroke-linecap="round"/><path d="M63 135c-8-42 15-68 69-70 50-2 78 26 78 70" fill="none" stroke="#ff8b5e" stroke-width="10" stroke-linecap="round"/><rect x="48" y="122" width="28" height="51" rx="13" fill="#ff9166" stroke="#34332d" stroke-width="3.5" transform="rotate(-8 62 147)"/><rect x="198" y="122" width="27" height="51" rx="13" fill="#ff9166" stroke="#34332d" stroke-width="3.5" transform="rotate(8 212 147)"/><path d="M57 131v25m150-25v25" stroke="#ffd3b8" stroke-width="4" stroke-linecap="round"/><path d="M227 67v-17l14-4v16" fill="none" stroke="#6e45ac" stroke-width="3"/><ellipse cx="224" cy="68" rx="5" ry="3.5" fill="#6e45ac"/><ellipse cx="238" cy="64" rx="5" ry="3.5" fill="#6e45ac"/>`:variant==='art'?`<path d="m74 136-16-7m137 7 16-7" stroke="#433547" stroke-width="4"/><path d="M76 126h48c4 0 5 4 7 5h10c3-1 4-5 8-5h46v25c0 8-6 13-14 13h-26c-9 0-13-7-15-17h-9c-2 10-6 17-15 17H91c-10 0-15-5-15-13Z" fill="url(#${id}chrome)" stroke="#38303f" stroke-width="3.5"/><path d="M83 133h39v17c0 5-3 7-8 7H93c-7 0-10-2-10-7Zm65 0h39v17c0 5-3 7-10 7h-20c-6 0-9-3-9-7Z" fill="#c8599d"/><path d="m96 134-6 18m16-18-7 20m64-20-6 18" stroke="#ffc1e4" stroke-width="3"/>`:variant==='market'?`<path d="m87 173 94 34" stroke="#625075" stroke-width="12"/><path d="m87 171 94 34" stroke="#c59ceb" stroke-width="7"/><path d="m131 166 8 12 14 1-10 11 3 14-15-6-12 6 2-14-10-11 14-1Z" fill="#b490e9" stroke="#38333e" stroke-width="3" stroke-linejoin="round"/><path d="m131 177 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z" fill="#ecf6aa"/>`:evo?`<path d="m109 75-8-25 21 10 14-27 13 27 22-10-8 25Z" fill="url(#${id}chrome)" stroke="#393047" stroke-width="3" stroke-linejoin="round"/><path d="m136 45 7 13-7 12-7-12Z" fill="#dafb84" stroke="#65588a" stroke-width="2"/><path d="m32 65 5 12 12 5-12 5-5 12-5-12-12-5 12-5Z" fill="#e4ff9b" stroke="#74608e" stroke-width="2"/><path d="m225 41 4 8 8 4-8 4-4 8-4-8-8-4 8-4Z" fill="#f6b8dc"/>`:'';
  return `<svg class="pet-art ${extra}" viewBox="0 0 270 250" fill="none" aria-hidden="true"><defs><linearGradient id="${id}body" x1="111" y1="63" x2="180" y2="222" gradientUnits="userSpaceOnUse"><stop stop-color="${light}"/><stop offset="1" stop-color="${dark}"/></linearGradient><linearGradient id="${id}chrome" x1="105" y1="56" x2="154" y2="171" gradientUnits="userSpaceOnUse"><stop stop-color="#fffaff"/><stop offset=".3" stop-color="#b9b9d5"/><stop offset=".48" stop-color="#f8f9fd"/><stop offset=".7" stop-color="#979bb7"/><stop offset="1" stop-color="#efe7ff"/></linearGradient></defs>${behind}<path d="M84 193c-13 11-17 22-10 27 7 5 23 0 34-10m65-15c13 9 18 20 10 25-7 5-23 0-34-10" fill="${light}" stroke="#34372c" stroke-width="3.5"/><path d="${body}" fill="url(#${id}body)" stroke="#34372c" stroke-width="3.5" stroke-linejoin="round"/><path d="m77 52 24 37-16 7c-8-16-16-38-8-44Zm118 0-23 38 15 5c8-16 16-37 8-43Z" fill="${evo?'#d9b7fa':'#f1b4cf'}" opacity=".85"/><path d="M74 120c7-15 20-24 35-26" stroke="#ffffff99" stroke-width="7" stroke-linecap="round"/><path d="M204 170c-10 20-28 27-45 27" stroke="${dark}" stroke-width="9" stroke-linecap="round" opacity=".55"/><ellipse cx="135" cy="187" rx="25" ry="16" fill="${evo?'#e6d8fa':'#ecf0c3'}" opacity=".85"/>${face}<ellipse cx="85" cy="159" rx="11" ry="5" fill="#ec94b3" opacity=".7"/><ellipse cx="185" cy="159" rx="11" ry="5" fill="#ec94b3" opacity=".7"/><path d="M124 161q5 9 11 2 7 7 12-2" stroke="#34372c" stroke-width="3.5" stroke-linecap="round"/><path d="m135 178 2.5 5 5.5 1-4 4 1 5-5-2.5-5 2.5 1-5-4-4 5.5-1Z" fill="${evo?'#8862cf':'#a392c6'}"/>${accessories}</svg>`;

function scenery(id){
  const s=id==='music'?'<path d="M15 130V58h48v72m10 0V44h31v86" fill="#9b83ca" opacity=".35"/><path d="m-5 30 110 80m230-100-140 115" stroke="#faf4ff" stroke-width="20" opacity=".3"/><circle cx="28" cy="84" r="10" fill="none" stroke="#6f549a" stroke-width="2" opacity=".4"/><circle cx="28" cy="113" r="7" fill="none" stroke="#6f549a" stroke-width="2" opacity=".4"/>':id==='art'?'<path d="M115-20v215M225-20v215" stroke="#ffe8f5" stroke-width="25" opacity=".4"/><rect x="120" y="27" width="71" height="85" rx="2" fill="#ed90bd" stroke="#bc6f98" stroke-width="2" transform="rotate(10 155 69)"/><path d="m135 85 17-34 9 26 15-5" fill="none" stroke="#ffcee5" stroke-width="8"/>':'<path d="M122 14h173l-10 32H131Z" fill="#cfda8a"/><path d="M138 14h24l-2 32h-28m60-32h24l5 32h-30m53-32h24l15 32h-30" fill="#eff5ca"/><path d="M135 48v105m148-105v105" stroke="#b8c47f" stroke-width="4"/><path d="m86 17 4 9 10 3-10 4-4 10-4-10-10-4 10-3Z" fill="#ab91d2"/>';
  return `<svg class="scenery" viewBox="0 0 350 167" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${s}</svg>`;
}
function navMarkup(){return `<button type="button" class="nav-btn" data-action="nav" data-view="pet" ${view==='pet'?'aria-current="page"':''}>${icon('pet')}我的宠物</button><button type="button" class="nav-btn" data-action="nav" data-view="explore" ${view==='explore'?'aria-current="page"':''}>${icon('compass')}今天去哪</button>`;}
function render(){
  document.body.classList.toggle('has-pet',Boolean(state.name));
  document.getElementById('storage-warning').hidden=storageOK;
  for(const id of ['desktop-nav','mobile-nav']){const nav=document.getElementById(id);nav.hidden=!state.name;nav.innerHTML=state.name?navMarkup():'';}
  document.getElementById('settings-button').innerHTML=icon('settings');
  document.getElementById('footer-local').innerHTML=icon('save')+(storageOK?'本机存档 · 不上传位置':'仅本次会话 · 未保存');
  main.innerHTML=!state.name?renderWelcome():view==='pet'?renderPetPage():renderExplore();
  if(flashNext){main.querySelector('.pet-card')?.classList.add('flash');flashNext=false;}
}
function hero(welcome=false){
  const look=lookFor(welcome?'base':state.equipped);
  return `<div><section class="pet-card" aria-label="${welcome?'待领养的宠物':esc(state.name)+'，'+look.name}"><div class="pet-topline mono"><span>YOUR LITTLE OUTSIDER / 001</span><span class="pet-online"><span class="live-dot"></span>${welcome?'等你领养':'出门模式'}</span></div><div class="pet-canvas ${look.id}"><span class="canvas-id mono">${look.label}</span>${starSVG('canvas-star')}<div class="speech" id="pet-speech">${look.speech}</div><span class="tiny-pixel" aria-hidden="true">✧</span><span class="tiny-pixel second" aria-hidden="true">✦</span><div class="ground"></div><button class="pet-touch" type="button" data-action="pet" aria-label="摸摸${welcome?'宠物':esc(state.name)}">${petSVG(look.id)}</button><span class="orbit-note mono">OFFLINE<br>IS A MOOD.</span><span class="screen-badge">${look.id==='evolved'?'限定<br>出逃星人':'带我<br>出去玩！'}</span></div><div class="pet-caption"><div class="pet-name">${welcome?'你的新搭子':esc(state.name)}<span class="look-label">${look.name} · ${welcome?'还没开始的冒险':'今天的出门记录'}</span></div><span class="look-chip">${icon(look.id==='evolved'?'sparkle':'heart')}${welcome?'待领养':look.id==='base'?'初次见面':look.id==='evolved'?'已进化':'限定造型'}</span></div></section><div class="hero-under"><span>${icon('heart')}点击宠物，打个招呼</span><span class="mono">REAL LIFE, NEW LOOK.</span></div></div>`;
}
function renderWelcome(){
  return `<div class="page-intro"><div><h1>把出门，养成喜欢的样子。</h1><p class="intro-copy">逛活动、捡造型。你去哪里，它就长点不一样。</p></div><span class="intro-mark mono">LET’S GO OUT ↗</span></div><div class="main-grid welcome-grid">${hero(true)}<div class="side-stack"><section class="panel adopt-panel"><div class="eyebrow">A LITTLE FRIEND. A REAL ADVENTURE.</div><h2>先领一只。<br><span class="under">然后，出门。</span></h2><p>到 3 个地点打卡，给它收集新造型。<br>集齐一套，就能解锁活动限定形态。</p><form id="adopt-form"><label class="name-label" for="pet-name">给新搭子起个名字<span>最多 12 个字</span></label><input id="pet-name" class="name-input" name="petName" value="MOMO" maxlength="24" autocomplete="off" spellcheck="false" aria-describedby="name-error"><div class="input-error" id="name-error" role="alert"></div><button type="submit" class="btn btn-primary" id="adopt-button">领养，出门玩 ${icon('arrow')}</button></form><div class="form-foot">${icon('lock')}不用注册 · 进度只保存在当前浏览器</div></section><section class="panel howto"><div class="how-title mono">HOW TO PLAY / 只需要做这三件事</div><div class="steps"><div class="step"><span class="step-num mono">1</span><strong>逛一逛</strong><p>带它去活动地点</p></div><div class="step"><span class="step-num mono">2</span><strong>捡造型</strong><p>打卡就能换新样子</p></div><div class="step"><span class="step-num mono">3</span><strong>变身！</strong><p>集齐三个，解锁进化</p></div></div></section></div></div>`;
}
function progressMarkup(){
  return `<div class="progress-row"><div class="stamp-track" aria-label="已收集 ${count()} 个地点，共 3 个">${SPOTS.map((s,i)=>`${i?`<span class="track-line ${state.rewards[s.id]?'done':''}" aria-hidden="true"></span>`:''}<span class="stamp ${state.rewards[s.id]?'done':''}" title="${s.zone}${state.rewards[s.id]?'：已打卡':'：未打卡'}">${icon(s.icon)}</span>`).join('')}</div><div class="count mono">${count()}<span>/ 3</span></div></div>`;
}
function goalMarkup(){
  const n=count(),complete=n===3;
  const heading=state.evolved?'这趟出门，长出新模样。':complete?'三个地点，集齐了！':'今天，带它逛三个地方。';
  const copy=state.evolved?'限定「出逃星人」已解锁，换上喜欢的造型吧。':complete?'你的宠物准备好变身了。打开最后一份奖励。':'每到一站，拿一个造型。集齐后还有一次进化。';
  return `<section class="goal-panel panel"><div class="eyebrow">WEEKEND.exe / 周末出逃计划</div><h2>${heading}</h2><p class="goal-copy">${copy}</p>${progressMarkup()}<button class="btn btn-dark" type="button" data-action="${complete&&!state.evolved?'evolve-prompt':'nav'}" data-view="explore">${complete&&!state.evolved?'解锁限定形态':state.evolved?'看看今天的足迹':n?'继续逛逛，拿下一个':'去拿第一个造型'}${icon(complete&&!state.evolved?'sparkle':'arrow')}</button></section>`;
}
function collectionMarkup(){
  return `<section class="panel collection"><div class="section-top"><h2>我的造型</h2><span class="small-meta mono">${LOOKS.filter(l=>unlocked(l.id)).length} / 5 已解锁</span></div><div class="looks-grid">${LOOKS.map(l=>`<button type="button" class="look-option ${!unlocked(l.id)?'locked':''} ${state.equipped===l.id?'active':''}" data-action="${unlocked(l.id)?'equip-inline':'look'}" data-look="${l.id}" aria-label="${l.name}，${state.equipped===l.id?'正在穿戴':unlocked(l.id)?'已解锁，点击换上':l.id==='evolved'&&count()===3?'可解锁':'未解锁，点击查看获取方法'}" aria-pressed="${state.equipped===l.id}"><span class="look-thumb ${l.id}">${petSVG(l.id)}${state.equipped===l.id?`<span class="wear-pin">${icon('check')}</span>`:!unlocked(l.id)?`<span class="lock-pin">${icon(l.id==='evolved'&&count()===3?'sparkle':'lock')}</span>`:''}</span><span class="look-name">${l.short}</span></button>`).join('')}</div><p class="collection-note">${icon('info')}点造型换上；还没拿到的，点开看看去哪里领。</p></section>`;
}
function renderPetPage(){
  return `<div class="page-intro"><div><h1>${esc(state.name)} 的出门日记。</h1><p class="intro-copy">${count()===0?'今天还没出门。第一站，想去哪？':count()<3?'已经捡到 '+count()+' 个新造型。再去看看下一站？':'三个地点，三个小故事。今天没有白出门。'}</p></div><span class="intro-mark mono">${state.evolved?'NEW FORM! ✦':'LET’S GO OUT ↗'}</span></div><div class="main-grid">${hero()}<div class="side-stack">${goalMarkup()}${collectionMarkup()}<div class="quiet-note">${icon('sparkle')}不用喂饭，也不用每天签到。<br>你带它出去探索，它就慢慢变成你的样子。</div></div></div>`;
}
function renderExplore(){
  return `<div class="page-intro activity-heading"><div><h1>今天去哪，就长成哪样。</h1><p class="intro-copy">先选一个你喜欢的造型，再带它出发。</p></div><button class="back-link" type="button" data-action="nav" data-view="pet">${icon('back')}回去看看它</button></div><section class="event-banner" aria-label="周末出逃计划，演示活动"><div class="event-banner-main"><div class="event-tags"><span class="event-tag mono">${icon('compass')}3 SPOTS / 1 ADVENTURE</span><span class="event-tag">虚构活动 · DEMO</span></div><div class="event-wordmark">WEEKEND<em>.exe</em></div><p class="event-sub">周末出逃计划 / 给日常加载一点新东西</p></div><div class="event-banner-side">${starSVG('banner-star')}<div class="ticket-ring"><strong class="mono">${count()}/3</strong><span>地点已探索</span></div></div></section><div class="demo-notice">${icon('info')}本页用按钮模拟现场扫码，不读取位置，也没有真实活动预约。三个地点不限顺序。</div><div class="spots-grid">${SPOTS.map(spotCard).join('')}</div><div class="route-note">${icon(count()===3?'sparkle':'lock')}${count()===3?(state.evolved?'今日限定形态已解锁。':`三个地点都去过了。<button type="button" data-action="evolve-prompt">去解锁限定形态</button>`):'集齐三个不同地点，解锁限定「出逃星人」。'}</div>`;
}
function spotCard(s){
  const done=Boolean(state.rewards[s.id]);
  return `<article class="spot-card" id="spot-${s.id}"><div class="spot-art ${s.id}">${scenery(s.id)}<span class="spot-number mono">SPOT ${s.number} / ${s.zone}</span><div class="spot-art-title">${s.en}<small>${s.tag}</small></div>${petSVG(s.id)}${done?`<span class="claimed-flag">${icon('check')}已打卡</span>`:''}</div><div class="spot-body"><div class="spot-headline"><h2>${s.name}</h2><span class="spot-zone mono">${s.zone}</span></div><p class="spot-reward"><span>${done?'已获得':'打卡可得'} / </span>${s.reward}<br><span>${s.line}</span></p><button type="button" class="btn ${done?'btn-quiet':'btn-primary'}" data-action="${done?'look':'checkin'}" ${done?`data-look="${s.id}"`:`data-spot="${s.id}"`}>${icon(done?'check':'qr')}${done?'查看已得造型':'模拟到场打卡'}${done?'':icon('arrow')}</button></div></article>`;
}
function navigate(target,focusSpot=null){
  if(!state.name){toast('先给它起个名字，领养后再出发。');document.getElementById('pet-name')?.focus();return;}
  view=target==='explore'?'explore':'pet';
  try{history.replaceState(null,'','#/'+view);}catch(e){}
  render();window.scrollTo(0,0);
  if(focusSpot){const card=document.getElementById('spot-'+focusSpot);card?.classList.add('focus-spot');card?.scrollIntoView({block:'center',behavior:reduceMotion.matches?'auto':'smooth'});setTimeout(()=>card?.classList.remove('focus-spot'),1800);}
}
function toast(message){const el=document.getElementById('toast');clearTimeout(toastTimer);el.textContent=message;el.classList.add('visible');toastTimer=setTimeout(()=>el.classList.remove('visible'),2600);}
function modal(content,type){
  const wasOpen=dialog.open;if(!wasOpen)lastFocused=document.activeElement;
  currentModal=type;dialog.innerHTML=`<div class="modal-inner"><button class="icon-btn modal-close" data-action="close" type="button" aria-label="关闭弹窗">${icon('close')}</button>${content}</div>`;
  if(!wasOpen)dialog.showModal();
  const focus=dialog.querySelector('input, .modal-actions .btn, .btn, .modal-close');focus?.focus({preventScroll:true});
}
function closeModal(){if(dialog.open)dialog.close();currentModal=null;if(lastFocused&&document.contains(lastFocused))lastFocused.focus({preventScroll:true});else main.focus({preventScroll:true});}
function showCheckin(id){
  const s=SPOTS.find(s=>s.id===id);if(!s||!state.name)return;
  if(state.rewards[id]){showLook(id);return;}
  modal(`<p class="modal-eyebrow mono">DEMO CHECK-IN / SPOT ${s.number}</p><h2 id="dialog-title">到${s.name}啦。</h2><p class="modal-copy">真实玩法是在现场扫码。这里点一下，模拟到场领取。</p><div class="checkin-frame">${icon('qr')}<span class="mono">SIMULATE A REAL-WORLD MOMENT</span></div><p class="modal-copy">这站会给 ${esc(state.name)} 带来：<strong>${s.reward}</strong>。</p><div class="modal-actions"><button class="btn btn-primary" data-action="redeem" data-spot="${id}" type="button">打卡，收下造型 ${icon('arrow')}</button></div><p class="modal-note">仅为本地演示，不验证位置，不发放真实活动权益。</p>`, 'checkin');
}
function redeem(id){
  const s=SPOTS.find(s=>s.id===id);if(!s||!state.name)return;
  if(state.rewards[id]){showLook(id);toast('这站已经打过卡，不会重复领取。');return;}
  state.rewards[id]=new Date().toISOString();save();render();showReward(id);confetti();
}
function rewardStage(id,label='NEW LOOK',stamp='COLLECTED!'){
  return `<div class="reward-stage ${id}"><span class="stage-label mono">${label}</span>${petSVG(id)}<span class="reward-stamp mono">${stamp}</span></div>`;
}
function showReward(id){
  const s=SPOTS.find(s=>s.id===id);const all=count()===3;
  modal(`<p class="modal-eyebrow mono">LITTLE ADVENTURE, NEW LOOK.</p><h2 id="dialog-title">新造型到手！</h2><p class="modal-copy">${s.reward} · 来自${s.name}</p>${rewardStage(id)}<div class="reward-progress">${icon(all?'sparkle':'pin')}<span><strong>${count()} / 3 个地点已集齐</strong><br>${all?'还解锁了一次进化。去看看最后的惊喜？':'还差 '+(3-count())+' 个地点，就能解锁限定形态。'}</span></div><div class="modal-actions"><button class="btn btn-primary" data-action="wear-reward" data-look="${id}" type="button">${all?'穿上，去进化':'穿上，看看它'} ${icon('arrow')}</button><button class="text-btn" type="button" data-action="close">先收好，继续逛</button></div>`, 'reward');
}
function showLook(id){
  const look=lookFor(id);if(id==='evolved'&&!state.evolved&&count()===3){showEvolutionPrompt();return;}
  if(unlocked(id)){
    modal(`<p class="modal-eyebrow mono">YOUR LOOK / ${look.label}</p><h2 id="dialog-title">${look.name}</h2><p class="modal-copy">${id==='base'?'最初见面的样子，也可以一直保留。':id==='evolved'?'探索三个地点后获得的活动限定形态。':'已经收进你的衣橱，随时都能换上。'}</p>${rewardStage(id,'UNLOCKED',state.equipped===id?'WEARING NOW':'YOURS FOREVER')}<div class="modal-actions"><button class="btn btn-primary" type="button" data-action="wear" data-look="${id}">${state.equipped===id?'正在穿着，回去看看':'换上这个造型'} ${icon('arrow')}</button></div>`, 'look');
  }else{
    const s=SPOTS.find(s=>s.id===id);
    modal(`<p class="modal-eyebrow mono">NOT YET. GO GET IT.</p><h2 id="dialog-title">${look.name}</h2><p class="modal-copy">${s?'去'+s.name+'打卡，就能把这个造型带回来。':'探索音乐区、展览区和市集区，集齐三个地点后解锁。'}</p>${rewardStage(id,'PREVIEW / 未解锁','GO OUT TO GET IT')}<div class="modal-actions"><button class="btn btn-primary" data-action="goto-spot" data-spot="${s?s.id:''}" type="button">${s?'去'+s.zone+'看看':'去收集三个地点'} ${icon('arrow')}</button></div>`, 'locked');
  }
}
function wear(id){if(!unlocked(id))return;state.equipped=id;save();closeModal();flashNext=true;navigate('pet');toast('已换上「'+lookFor(id).name+'」。');}
function showEvolutionPrompt(){
  if(!state.name||count()!==3){toast('先收集三个不同地点的造型。');return;}
  if(state.evolved){showLook('evolved');return;}
  modal(`<p class="modal-eyebrow mono">3 SPOTS. A DIFFERENT YOU.</p><h2 id="dialog-title">出门三站，<br>长出新模样。</h2><p class="modal-copy">音乐、展览，还有捡来的小快乐。<br>${esc(state.name)} 准备好变成「出逃星人」了。</p><div class="reward-stage evolved hidden-look"><span class="stage-label mono">A NEW FORM IS WAITING</span>${petSVG('evolved')}<span class="reward-stamp mono">READY TO EVOLVE</span></div><div class="modal-actions"><button class="btn btn-primary" data-action="evolve" type="button">让它进化 ${icon('sparkle')}</button><button class="text-btn" type="button" data-action="close">等一下，先看看其他造型</button></div>`, 'evolution-ready');
}
function evolve(){
  if(count()!==3||!state.name)return;
  state.evolved=true;save();render();
  modal(`<span class="success-chip">${icon('check')}活动限定形态已解锁</span><h2 id="dialog-title">你好，出逃星人。</h2><p class="modal-copy">你去过的地方，真的让它变得不一样了。</p>${rewardStage('evolved','AFTER HOURS / 005','EVOLVED!')}<p class="modal-copy">这次冒险的 5 套造型都收齐了。你可以继续换装，或在演示设置里从头再玩。</p><div class="modal-actions"><button class="btn btn-primary" type="button" data-action="wear" data-look="evolved">换上限定形态 ${icon('sparkle')}</button></div>`, 'evolution-done');confetti();
}
function confetti(){
  if(reduceMotion.matches)return;
  const layer=document.createElement('div');layer.className='confetti';layer.setAttribute('aria-hidden','true');
  const colors=['#d8fa68','#9876ef','#f4b2db','#ff805b','#fffef9'];
  for(let i=0;i<21;i++){const p=document.createElement('i');p.style.cssText=`--x:${(i*37)%100}%;--c:${colors[i%5]};--d:${(i%7)*.055}s;--r:${(i%2?1:-1)*(160+i*20)}deg`;layer.appendChild(p);}
  dialog.querySelector('.modal-inner')?.appendChild(layer);setTimeout(()=>layer.remove(),2100);
}
function showSettings(){
  modal(`<p class="modal-eyebrow mono">OUTIE / DEMO SETTINGS</p><h2 id="dialog-title">这个 Demo 怎么玩</h2><p class="modal-copy">领宠物 → 模拟三个地点打卡 → 收集造型 → 解锁进化。</p>${state.name?`<form id="rename-form"><label class="name-label" for="rename-input">宠物名字<span>最多 12 个字</span></label><input id="rename-input" class="name-input" value="${esc(state.name)}" maxlength="24" autocomplete="off" aria-describedby="rename-error"><div id="rename-error" class="input-error" role="alert"></div><div class="modal-actions"><button type="submit" class="btn btn-quiet">保存名字</button></div></form>`:''}<div class="setting-section"><h3>只保存在当前浏览器</h3><p class="about-list">这是可离线运行的单人原型。没有账号、定位、好友、硬件连接或真实活动后台。<br>清除浏览器数据、使用无痕模式或换设备，可能丢失进度。演示活动与奖励均为虚构。</p></div>${state.name?`<div class="setting-section"><button class="btn danger-btn" type="button" data-action="reset-prompt">${icon('reset')}从头再玩</button></div>`:''}<p class="modal-note mono">BUILD 0.1 / SOFTWARE FIRST / ORIGINAL PET ART</p>`, 'settings');
}
function resetPrompt(){modal(`<p class="modal-eyebrow mono">START A NEW ADVENTURE?</p><h2 id="dialog-title">要从头再玩吗？</h2><p class="modal-copy">这会清除当前浏览器里 ${esc(state.name)} 的名字、造型和打卡进度。操作不能撤销。</p><div class="modal-actions"><button type="button" class="btn danger-btn" data-action="reset-confirm">清除进度，重新领养</button><button type="button" class="btn btn-quiet" data-action="close">保留我的宠物</button></div>`,'reset-confirm');}
function reset(){state=blankState();save();closeModal();view='pet';try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}render();window.scrollTo(0,0);toast('新的一次出门，从这里开始。');}
function handleAction(button){
  const action=button.dataset.action;
  switch(action){
    case 'home':if(state.name)navigate('pet');else window.scrollTo({top:0,behavior:'smooth'});break;
    case 'nav':navigate(button.dataset.view);break;
    case 'settings':showSettings();break;
    case 'close':closeModal();break;
    case 'checkin':showCheckin(button.dataset.spot);break;
    case 'redeem':redeem(button.dataset.spot);break;
    case 'look':showLook(button.dataset.look);break;
    case 'equip-inline':wear(button.dataset.look);break;
    case 'wear':wear(button.dataset.look);break;
    case 'wear-reward':{
      const id=button.dataset.look;if(!unlocked(id))break;
      state.equipped=id;save();closeModal();flashNext=true;navigate('pet');if(count()===3&&!state.evolved)showEvolutionPrompt();break;
    }
    case 'goto-spot':closeModal();navigate('explore',button.dataset.spot||null);break;
    case 'evolve-prompt':showEvolutionPrompt();break;
    case 'evolve':evolve();break;
    case 'reset-prompt':resetPrompt();break;
    case 'reset-confirm':reset();break;
    case 'pet':{
      const messages=!state.name?['先给我起个名字吧。','准备好一起出门了吗？']:count()===3?['今天没有白出门。','三个地点，三个小故事。','带我给朋友看看？']:['带我去逛逛？','想去拿'+SPOTS.find(s=>!state.rewards[s.id]).reward+'。','不用赶，慢慢逛。'];
      const speech=document.getElementById('pet-speech');if(speech){const i=messages.indexOf(speech.textContent);speech.textContent=messages[(i+1)%messages.length];}break;
    }
  }
}
document.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(button&&!button.disabled)handleAction(button);});
document.addEventListener('submit',event=>{
  if(event.target.id==='adopt-form'){
    event.preventDefault();const input=document.getElementById('pet-name');const name=trimName(input.value);
    if(!name){document.getElementById('name-error').textContent='先起一个名字吧。';input.focus();return;}
    state={...blankState(),name,createdAt:new Date().toISOString()};save();flashNext=true;navigate('pet');toast(name+' 已加入你的出门小队。');
  }
  if(event.target.id==='rename-form'){
    event.preventDefault();const input=document.getElementById('rename-input');const name=trimName(input.value);
    if(!name){document.getElementById('rename-error').textContent='名字不能为空。';input.focus();return;}
    state.name=name;save();closeModal();render();toast('名字已保存。');
  }
});
dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
dialog.addEventListener('cancel',event=>{event.preventDefault();closeModal();});
window.addEventListener('hashchange',()=>{if(!state.name)return;view=location.hash.includes('explore')?'explore':'pet';closeModal();render();});
window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY){state=loadState();closeModal();render();}});
render();
</script>
</body>
</html>
